<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全功能線上 EPUB 閱讀器 (具備書庫保存與進度記憶功能)</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- JSZip (EPUB 檔案解壓縮必備) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <!-- epub.js 核心庫 -->
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        sepia: {
                            50: '#fbf0d9',
                            100: '#f4ecd8',
                            800: '#5f4b32',
                            900: '#3d2e1e'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        #viewer-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto; /* 允許必要時滾動 */
        }

        #viewer {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        #viewer iframe {
            border: none;
            background: transparent !important;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        #image-modal {
            transition: opacity 0.2s ease;
        }

        /* 側邊透明懸浮翻頁按鈕樣式調整，避免遮擋核心閱讀文字 */
        .page-nav-btn {
            opacity: 0.35;
            transition: all 0.25s ease;
        }
        .page-nav-btn:hover {
            opacity: 0.95;
            transform: scale(1.08);

                        <i class="fa-solid fa-wand-magic-sparkles text-2xl text-amber-500"></i>

                <i class="fa-solid fa-chevron-left text-lg"></i>

            <!-- EPUB 電子書渲染地帶 -->

                <div id="viewer"></div>
            </div>

            <!-- 右側翻頁導航按鈕 (半透明懸浮) -->
            <button id="next-btn" class="page-nav-btn absolute right-2 sm:right-4 z-10 w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-white/90 dark:bg-gray-800/90 shadow-lg border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-200 flex items-center justify-center hover:bg-indigo-50 dark:hover:bg-gray-700 hover:text-indigo-600 backdrop-blur-sm">

    <div id="image-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden opacity-0 pointer-events-none">

    <!-- 底部閱讀進度條與資訊 -->
    <footer class="bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 px-4 py-2.5 flex items-center justify-between text-xs text-gray-500 dark:text-gray-400 z-20">
        <div class="flex items-center space-x-2 w-full max-w-xl mx-auto">
            <span id="curr-location" class="font-mono whitespace-nowrap min-w-[3rem] text-right">0%</span>
            <input type="range" id="progress-slider" min="0" max="100" value="0" step="1" class="w-full h-1.5 bg-gray-200 dark:bg-gray-700 rounded-lg appearance-none cursor-pointer accent-indigo-600">
            <span id="page-info" class="whitespace-nowrap hidden sm:inline font-mono">頁碼準備中...</span>
        </div>
    </footer>

    <script>
        /**
         * IndexedDB 管理模組，負責將 EPUB 檔案與閱讀進度永久儲存於瀏覽器內
         */
        class BookStorage {
            constructor() {
                this.dbName = 'EpubReaderStorage';
                this.dbVersion = 1;
                this.db = null;
            }

            async init() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.dbName, this.dbVersion);

                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('books')) {
                            const store = db.createObjectStore('books', { keyPath: 'id' });
                            store.createIndex('updatedAt', 'updatedAt', { unique: false });
                        }
                    };

                    request.onsuccess = (e) => {
                        this.db = e.target.result;
                        resolve(this.db);
                    };

                    request.onerror = (e) => reject(e.target.error);
                });
            }

            async saveBook(bookData) {
                if (!this.db) await this.init();
                return new Promise((resolve, reject) => {
                    const transaction = this.db.transaction(['books'], 'readwrite');
                    const store = transaction.objectStore('books');
                    const request = store.put({
                        id: bookData.id,
                        title: bookData.title || '未命名書籍',
                        author: bookData.author || '未知作者',
                        arrayBuffer: bookData.arrayBuffer,
                        lastLocationCfi: bookData.lastLocationCfi || null,
                        progressPercent: bookData.progressPercent || 0,
                        updatedAt: Date.now()
                    });

                    request.onsuccess = () => resolve();
                    request.onerror = (e) => reject(e.target.error);
                });
            }

            async getAllBooks() {
                if (!this.db) await this.init();
                return new Promise((resolve, reject) => {
                    const transaction = this.db.transaction(['books'], 'readonly');
                    const store = transaction.objectStore('books');
                    const request = store.getAll();

                    request.onsuccess = () => {
                        const books = request.result || [];
                        books.sort((a, b) => b.updatedAt - a.updatedAt);
                        resolve(books);
                    };
                    request.onerror = (e) => reject(e.target.error);
                });
            }

            async getBook(id) {
                if (!this.db) await this.init();
                return new Promise((resolve, reject) => {
                    const transaction = this.db.transaction(['books'], 'readonly');
                    const store = transaction.objectStore('books');
                    const request = store.get(id);

                    request.onsuccess = () => resolve(request.result);
                    request.onerror = (e) => reject(e.target.error);
                });
            }

            async updateProgress(id, cfi, percentage) {
                if (!this.db) await this.init();
                const book = await this.getBook(id);
                if (book) {
                    book.lastLocationCfi = cfi;
                    book.progressPercent = percentage;
                    book.updatedAt = Date.now();
                    await this.saveBook(book);
                }
            }

            async deleteBook(id) {
                if (!this.db) await this.init();
                return new Promise((resolve, reject) => {
                    const transaction = this.db.transaction(['books'], 'readwrite');
                    const store = transaction.objectStore('books');
                    const request = store.delete(id);

                    request.onsuccess = () => resolve();
                    request.onerror = (e) => reject(e.target.error);
                });
            }
        }

        class EpubReaderApp {
            constructor() {
                this.storage = new BookStorage();
                this.currentBookId = null;
                this.book = null;
                this.rendition = null;
                this.toc = [];
                
                this.isVertical = false;
                this.isSinglePage = true;
                this.currentTheme = 'light';
                this.fontSizePercent = 100;
                this.fontFamily = 'system';
                
                this.dom = {
                    fileInput: document.getElementById('file-input'),
                    exitBtn: document.getElementById('exit-btn'),
                    libraryBtn: document.getElementById('library-btn'),
                    loadSampleBtn: document.getElementById('load-sample-btn'),
                    uploadOverlay: document.getElementById('upload-overlay'),
                    libraryGrid: document.getElementById('library-grid'),
                    libraryCount: document.getElementById('library-count'),
                    viewer: document.getElementById('viewer'),
                    prevBtn: document.getElementById('prev-btn'),
                    nextBtn: document.getElementById('next-btn'),
                    tocBtn: document.getElementById('toc-btn'),
                    closeTocBtn: document.getElementById('close-toc'),
                    tocSidebar: document.getElementById('toc-sidebar'),
                    sidebarOverlay: document.getElementById('sidebar-overlay'),
                    tocList: document.getElementById('toc-list'),
                    bookTitle: document.getElementById('book-title'),
                    bookAuthor: document.getElementById('book-author'),
                    layoutToggle: document.getElementById('layout-toggle'),
                    layoutText: document.getElementById('layout-text'),
                    spreadToggle: document.getElementById('spread-toggle'),
                    spreadText: document.getElementById('spread-text'),
                    fontFamilySelect: document.getElementById('font-family-select'),
                    fontIncrease: document.getElementById('font-increase'),
                    fontDecrease: document.getElementById('font-decrease'),
                    fontSizeDisplay: document.getElementById('font-size-display'),
                    themeBtns: document.querySelectorAll('.theme-btn'),
                    progressSlider: document.getElementById('progress-slider'),
                    currLocation: document.getElementById('curr-location'),
                    pageInfo: document.getElementById('page-info'),
                    imageModal: document.getElementById('image-modal'),
                    modalImg: document.getElementById('modal-img'),
                    closeModal: document.getElementById('close-modal'),
                    toast: document.getElementById('toast'),
                    toastMsg: document.getElementById('toast-msg')
                };

                this.initEvents();
                this.refreshLibraryUI();
            }

            initEvents() {
                this.dom.fileInput.addEventListener('change', async (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const arrayBuffer = await file.arrayBuffer();
                        const bookId = 'book_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
                        await this.loadAndSaveNewBook(bookId, arrayBuffer, file.name.replace('.epub', ''));
                    }
                });

                this.dom.loadSampleBtn.addEventListener('click', () => {
                    this.loadMultiLanguageSampleEpub();
                });

                if (this.dom.exitBtn) {
                    this.dom.exitBtn.addEventListener('click', () => this.showLibraryOverlay());
                }

                if (this.dom.libraryBtn) {
                    this.dom.libraryBtn.addEventListener('click', () => this.showLibraryOverlay());
                }

                window.addEventListener('dragover', (e) => e.preventDefault());
                window.addEventListener('drop', async (e) => {
                    e.preventDefault();
                    if (e.dataTransfer.files.length > 0 && e.dataTransfer.files[0].name.endsWith('.epub')) {
                        const file = e.dataTransfer.files[0];
                        const arrayBuffer = await file.arrayBuffer();
                        const bookId = 'book_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
                        await this.loadAndSaveNewBook(bookId, arrayBuffer, file.name.replace('.epub', ''));
                    }
                });

                this.dom.prevBtn.addEventListener('click', () => this.prevPage());
                this.dom.nextBtn.addEventListener('click', () => this.nextPage());

                this.dom.tocBtn.addEventListener('click', () => this.toggleToc(true));
                this.dom.closeTocBtn.addEventListener('click', () => this.toggleToc(false));
                this.dom.sidebarOverlay.addEventListener('click', () => this.toggleToc(false));

                this.dom.layoutToggle.addEventListener('click', () => this.toggleLayoutMode());
                if (this.dom.spreadToggle) {
                    this.dom.spreadToggle.addEventListener('click', () => this.toggleSpreadMode());
                }

                this.dom.fontFamilySelect.addEventListener('change', (e) => {
                    this.fontFamily = e.target.value;
                    this.applyCurrentStyle();
                });

                this.dom.fontIncrease.addEventListener('click', () => this.changeFontSize(10));
                this.dom.fontDecrease.addEventListener('click', () => this.changeFontSize(-10));

                this.dom.themeBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.setTheme(e.currentTarget.getAttribute('data-theme'));
                    });
                });

                this.dom.progressSlider.addEventListener('change', (e) => {
                    if (this.book && this.book.locations && this.book.locations.length()) {
                        const percentage = e.target.value / 100;
                        const cfi = this.book.locations.cfiFromPercentage(percentage);
                        if (cfi) this.rendition.display(cfi);
                    }
                });

                this.dom.closeModal.addEventListener('click', () => this.closeImageModal());
                this.dom.imageModal.addEventListener('click', (e) => {
                    if (e.target === this.dom.imageModal) this.closeImageModal();
                });

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowLeft') {
                        this.isVertical ? this.nextPage() : this.prevPage();
                    } else if (e.key === 'ArrowRight') {
                        this.isVertical ? this.prevPage() : this.nextPage();
                    } else if (e.key === 'Escape') {
                        this.closeImageModal();
                    }
                });
            }

            async refreshLibraryUI() {
                const books = await this.storage.getAllBooks();
                this.dom.libraryCount.textContent = books.length;
                this.dom.libraryGrid.innerHTML = '';

                if (books.length === 0) {
                    this.dom.libraryGrid.innerHTML = `
                        <div class="col-span-full py-8 text-center text-gray-400 bg-white dark:bg-gray-800 rounded-xl border border-dashed border-gray-300 dark:border-gray-700">
                            <i class="fa-solid fa-book-open text-3xl mb-2 text-gray-300 dark:text-gray-600"></i>
                            <p class="text-sm">書庫中尚無儲存的書籍，請上傳 EPUB 或載入範例書！</p>
                        </div>
                    `;
                    return;
                }

                books.forEach(book => {
                    const card = document.createElement('div');
                    card.className = 'group relative bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 hover:border-indigo-500 dark:hover:border-indigo-500 p-4 rounded-xl shadow-sm hover:shadow-md transition cursor-pointer flex flex-col justify-between';
                    
                    const percent = book.progressPercent || 0;
                    const dateStr = new Date(book.updatedAt).toLocaleDateString();

                    card.innerHTML = `
                        <div>
                            <div class="flex items-start justify-between mb-2">
                                <div class="w-9 h-9 rounded-lg bg-indigo-50 dark:bg-indigo-900/40 text-indigo-600 dark:text-indigo-400 flex items-center justify-center font-bold text-sm">
                                    <i class="fa-solid fa-book"></i>
                                </div>
                                <button class="delete-book-btn p-1.5 text-gray-400 hover:text-rose-500 transition rounded-lg" title="刪除此書">
                                    <i class="fa-solid fa-trash-can text-sm"></i>
                                </button>
                            </div>
                            <h4 class="font-bold text-gray-800 dark:text-gray-100 text-sm line-clamp-2 mb-1 group-hover:text-indigo-600 transition">${this.escapeHtml(book.title)}</h4>
                            <p class="text-xs text-gray-500 dark:text-gray-400 line-clamp-1 mb-3">${this.escapeHtml(book.author)}</p>
                        </div>
                        <div>
                            <div class="w-full bg-gray-200 dark:bg-gray-700 h-1.5 rounded-full overflow-hidden mb-2">
                                <div class="bg-indigo-600 h-full transition-all duration-300" style="width: ${percent}%"></div>
                            </div>
                            <div class="flex justify-between items-center text-[10px] text-gray-400">
                                <span>閱讀進度: ${percent}%</span>
                                <span>${dateStr}</span>
                            </div>
                        </div>
                    `;

                    card.addEventListener('click', (e) => {
                        if (!e.target.closest('.delete-book-btn')) {
                            this.openBookFromStorage(book.id);
                        }
                    });

                    card.querySelector('.delete-book-btn').addEventListener('click', async (e) => {
                        e.stopPropagation();
                        await this.storage.deleteBook(book.id);
                        this.showToast(`已從書庫中移除《${book.title}》`);
                        this.refreshLibraryUI();
                    });

                    this.dom.libraryGrid.appendChild(card);
                });
            }

            escapeHtml(str) {
                return str ? str.replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])) : '';
            }

            showLibraryOverlay() {
                this.dom.uploadOverlay.classList.remove('hidden');
                if (this.dom.exitBtn) this.dom.exitBtn.classList.add('hidden');
                this.refreshLibraryUI();
            }

            async loadAndSaveNewBook(bookId, arrayBuffer, fallbackTitle = '新書籍') {
                this.currentBookId = bookId;
                const tempBook = ePub(arrayBuffer);
                const meta = await tempBook.loaded.metadata;
                
                const title = meta.title || fallbackTitle;
                const author = meta.creator || '未知作者';

                await this.storage.saveBook({
                    id: bookId,
                    title: title,
                    author: author,
                    arrayBuffer: arrayBuffer,
                    lastLocationCfi: null,
                    progressPercent: 0
                });

                this.showToast(`成功加入書庫：《${title}》`);
                await this.renderEpub(arrayBuffer, null);
            }

            async openBookFromStorage(bookId) {
                const bookData = await this.storage.getBook(bookId);
                if (!bookData) {
                    this.showToast("找不到該書籍檔案。");
                    return;
                }

                this.currentBookId = bookId;
                await this.renderEpub(bookData.arrayBuffer, bookData.lastLocationCfi);
            }

            showToast(message) {
                if (!this.dom.toast) return;
                this.dom.toastMsg.textContent = message;
                this.dom.toast.classList.remove('hidden', 'translate-y-10', 'opacity-0');
                setTimeout(() => {
                    this.dom.toast.classList.add('translate-y-10', 'opacity-0');
                    setTimeout(() => this.dom.toast.classList.add('hidden'), 300);
                }, 3500);
            }

            async renderEpub(arrayBuffer, initialCfi) {
                try {
                    this.dom.uploadOverlay.classList.add('hidden');
                    if (this.dom.exitBtn) this.dom.exitBtn.classList.remove('hidden');

                    if (this.book) {
                        this.book.destroy();
                    }

                    this.dom.viewer.innerHTML = '';
                    this.book = ePub(arrayBuffer);

                    const metadata = await this.book.loaded.metadata;
                    this.dom.bookTitle.textContent = metadata.title || '未知書名';
                    this.dom.bookAuthor.textContent = metadata.creator || '未知作者';

                    const flowMode = this.isVertical ? 'scrolled' : 'paginated';
                    
                    this.rendition = this.book.renderTo("viewer", {
                        width: "100%",
                        height: "100%",
                        flow: flowMode,
                        spread: this.isSinglePage ? "none" : "auto"
                    });

                    if (initialCfi) {
                        await this.rendition.display(initialCfi);
                    } else {
                        await this.rendition.display();
                    }

                    this.applyCurrentStyle();

                    this.rendition.on('relocated', (location) => {
                        const percent = this.book.locations && this.book.locations.percentageFromCfi ? 
                            Math.round(this.book.locations.percentageFromCfi(location.start.cfi) * 100) : 0;
                        
                        this.dom.currLocation.textContent = percent + '%';
                        this.dom.progressSlider.value = percent;
                        this.dom.pageInfo.textContent = `章節進度中`;

                        if (this.currentBookId) {
                            this.storage.updateProgress(this.currentBookId, location.start.cfi, percent);
                        }
                    });

                    // 點擊圖片放大
                    this.rendition.hooks.content.register((contents) => {
                        const imgs = contents.document.querySelectorAll('img');
                        imgs.forEach(img => {
                            img.style.cursor = 'zoom-in';
                            img.addEventListener('click', () => {
                                this.dom.modalImg.src = img.src;
                                this.dom.imageModal.classList.remove('hidden', 'opacity-0');
                            });
                        });
                    });

                    // 產生目錄
                    const navigation = await this.book.loaded.navigation;
                    this.toc = navigation.toc || [];
                    this.renderTocList();

                    // 生成定位百分比
                    this.book.locations.generate(1024).catch(() => {});

                } catch (err) {
                    console.error(err);
                    this.showToast("解析 EPUB 檔案失敗，檔案可能損毀。");
                    this.showLibraryOverlay();
                }
            }

            renderTocList() {
                const listContainer = this.dom.tocList;
                listContainer.innerHTML = '';

                if (this.toc.length === 0) {
                    listContainer.innerHTML = `<p class="text-gray-400 text-center py-8">無章節目錄</p>`;
                    return;
                }

                const createTocItems = (items, level = 0) => {
                    const ul = document.createElement('ul');
                    ul.className = level === 0 ? 'space-y-1' : 'pl-4 space-y-1 mt-1 border-l border-gray-100 dark:border-gray-700';

                    items.forEach(item => {
                        const li = document.createElement('li');
                        const a = document.createElement('a');
                        a.className = 'block px-3 py-2 rounded-lg text-xs sm:text-sm text-gray-700 dark:text-gray-300 hover:bg-indigo-50 dark:hover:bg-gray-700 hover:text-indigo-600 transition truncate cursor-pointer';
                        a.textContent = item.label.trim();
                        a.addEventListener('click', () => {
                            if (this.rendition) {
                                this.rendition.display(item.href);
                                this.toggleToc(false);
                            }
                        });
                        li.appendChild(a);

                        if (item.subitems && item.subitems.length > 0) {
                            li.appendChild(createTocItems(item.subitems, level + 1));
                        }
                        ul.appendChild(li);
                    });
                    return ul;
                };

                listContainer.appendChild(createTocItems(this.toc));
            }

            toggleToc(show) {
                if (show) {
                    this.dom.tocSidebar.classList.remove('-translate-x-full');
                    this.dom.sidebarOverlay.classList.remove('hidden');
                } else {
                    this.dom.tocSidebar.classList.add('-translate-x-full');
                    this.dom.sidebarOverlay.classList.add('hidden');
                }
            }

            prevPage() {
                if (this.rendition) this.rendition.prev();
            }

            nextPage() {
                if (this.rendition) this.rendition.next();
            }

            toggleLayoutMode() {
                this.isVertical = !this.isVertical;
                this.dom.layoutText.textContent = this.isVertical ? '直排滾動' : '橫排閱讀';
                if (this.currentBookId) {
                    this.storage.getBook(this.currentBookId).then(book => {
                        if (book) this.renderEpub(book.arrayBuffer, book.lastLocationCfi);
                    });
                }
            }

            toggleSpreadMode() {
                this.isSinglePage = !this.isSinglePage;
                this.dom.spreadText.textContent = this.isSinglePage ? '單頁顯示' : '雙頁顯示';
                if (this.rendition) {
                    this.rendition.spread(this.isSinglePage ? "none" : "auto");
                }
            }

            changeFontSize(delta) {
                this.fontSizePercent = Math.min(200, Math.max(60, this.fontSizePercent + delta));
                this.dom.fontSizeDisplay.textContent = this.fontSizePercent + '%';
                this.applyCurrentStyle();
            }

            setTheme(themeName) {
                this.currentTheme = themeName;
                document.documentElement.classList.remove('dark');
                if (themeName === 'dark') {
                    document.documentElement.classList.add('dark');
                }
                this.applyCurrentStyle();
            }

            applyCurrentStyle() {
                if (!this.rendition) return;

                let background = '#ffffff';
                let color = '#1f2937';

                if (this.currentTheme === 'dark') {
                    background = '#111827';
                    color = '#f3f4f6';
                } else if (this.currentTheme === 'sepia') {
                    background = '#f4ecd8';
                    color = '#3d2e1e';
                }

                let fontFamilyCss = '';
                if (this.fontFamily === 'serif') {
                    fontFamilyCss = 'serif, "Songti SC", "SimSun", "Noto Serif TC"';
                } else if (this.fontFamily === 'sans') {
                    fontFamilyCss = 'sans-serif, "Microsoft JhengHei", "Noto Sans TC"';
                }

                this.rendition.themes.default({
                    'body': {
                        'background': background + ' !important',
                        'color': color + ' !important',
                        'font-size': this.fontSizePercent + '% !important',
                        'font-family': fontFamilyCss ? fontFamilyCss + ' !important' : 'inherit'
                    },
                    'p, span, div, li, h1, h2, h3, h4, h5, h6': {
                        'color': color + ' !important',
                        'font-family': fontFamilyCss ? fontFamilyCss + ' !important' : 'inherit'
                    }
                });
            }

            closeImageModal() {
                this.dom.imageModal.classList.add('opacity-0', 'hidden');
                this.dom.modalImg.src = '';
            }

            async loadMultiLanguageSampleEpub() {
                this.showToast("正在載入多語系範例書包...");
                try {
                    const zip = new JSZip();
                    zip.file("mimetype", "application/epub+zip", {compression: "STORE"});
                    
                    const containerXml = `<?xml version="1.0" encoding="UTF-8"?>
                    <container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">
                        <rootfiles>
                            <rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/>
                        </rootfiles>
                    </container>`;
                    zip.file("META-INF/container.xml", containerXml);

                    const contentOpf = `<?xml version="1.0" encoding="UTF-8"?>
                    <package xmlns="http://www.idpf.org/200/opf" unique-id="BookId" version="3.0">
                        <metadata xmlns:dc="http://purl.org/dc/elements/1.1/">
                            <dc:title>全功能 EPUB 範例書 (中日英)</dc:title>
                            <dc:creator>Reader System</dc:creator>
                            <dc:language>zh-TW</dc:language>
                            <meta property="dcterms:modified">2026-06-06T00:00:00Z</meta>
                        </metadata>
                        <manifest>
                            <item id="ncx" href="toc.ncx" media-type="application/x-dtbncx+xml"/>
                            <item id="style" href="style.css" media-type="text/css"/>
                            <item id="chap1" href="chap1.xhtml" media-type="application/xhtml+xml"/>
                            <item id="chap2" href="chap2.xhtml" media-type="application/xhtml+xml"/>
                        </manifest>
                        <spine toc="ncx">
                            <itemref idref="chap1"/>
                            <itemref idref="chap2"/>
                        </spine>
                    </package>`;
                    zip.file("OEBPS/content.opf", contentOpf);

                    const tocNcx = `<?xml version="1.0" encoding="UTF-8"?>
                    <ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1">
                        <head>
                            <meta name="dtb:uid" content="BookId"/>
                            <meta name="dtb:depth" content="1"/>
                            <meta name="dtb:totalPageCount" content="0"/>
                            <meta name="dtb:maxPageNoframes" content="0"/>
                        </head>
                        <docTitle><text>全功能 EPUB 範例書</text></docTitle>
                        <navMap>
                            <navPoint id="navPoint-1" playOrder="1"><navLabel><text>第一章：中文與英文排版</text></navLabel><content src="chap1.xhtml"/></navPoint>
                            <navPoint id="navPoint-2" playOrder="2"><navLabel><text>第二章：日文混合與閱讀說明</text></navLabel><content src="chap2.xhtml"/></navPoint>
                        </navMap>
                    </ncx>`;
                    zip.file("OEBPS/toc.ncx", tocNcx);

                    const styleCss = `body { font-family: sans-serif; line-height: 1.6; padding: 1rem; } h1 { color: #4f46e5; }`;
                    zip.file("OEBPS/style.css", styleCss);

                    const chap1 = `<?xml version="1.0" encoding="UTF-8"?>
                    <!DOCTYPE html>
                    <html xmlns="http://www.w3.org/1999/xhtml" lang="zh-TW">
                    <head><title>第一章</title><link rel="stylesheet" href="style.css"/></head>
                    <body>
                        <h1>第一章：歡迎使用線上 EPUB 閱讀器</h1>
                        <p>這是一本內建的<b>多語系範例書</b>。本閱讀器支援自動儲存閱讀進度於瀏覽器內，關閉頁面後再次打開也能夠直接接續閱讀。</p>
                        <p>現在左右兩側的翻頁按鈕已經改為<b>半透明懸浮設計</b>，移開滑鼠時呈現半透明，不會再阻擋正文閱讀與拉動檢視！</p>
                    </body>
                    </html>`;
                    zip.file("OEBPS/chap1.xhtml", chap1);

                    const chap2 = `<?xml version="1.0" encoding="UTF-8"?>
                    <!DOCTYPE html>
                    <html xmlns="http://www.w3.org/1999/xhtml" lang="ja">
                    <head><title>第二章</title><link rel="stylesheet" href="style.css"/></head>
                    <body>
                        <h1>第二章：機能と設定について</h1>
                        <p>このリーダーは単頁・見開き表示、ダークモード・セピアモード切り替えに対応しています。</p>
                        <p>自由にフォントサイズを変更したり、ページスライダーで高速に移動することも可能です。</p>
                    </body>
                    </html>`;
                    zip.file("OEBPS/chap2.xhtml", chap2);

                    const blob = await zip.generateAsync({ type: "blob" });
                    const arrayBuffer = await blob.arrayBuffer();
                    const sampleId = 'sample_multilang_book';

                    await this.loadAndSaveNewBook(sampleId, arrayBuffer, "全功能 EPUB 範例書 (中日英)");
                } catch (err) {
                    console.error(err);
                    this.showToast("載入範例書失敗");
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            window.readerApp = new EpubReaderApp();
        });
    </script>
</body>
</html>
