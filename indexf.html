<!DOCTYPE html>
<html lang="zh-Hant" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雲端檔案寄託、預覽與跨裝置分享站</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QRCode Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
        }
        .file-card-hover {
            transition: all 0.2s ease-in-out;
        }
        .file-card-hover:hover {
            transform: translateY(-2px);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.5);
            border-radius: 3px;
        }
    </style>
</head>

<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-full flex flex-col transition-colors duration-200">

    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-tr from-blue-600 to-indigo-500 rounded-xl flex items-center justify-center text-white shadow-md">
                    <i class="fa-solid fa-cloud-arrow-up text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight flex items-center gap-2">
                        雲端檔案寄託與預覽站
                        <span class="text-[10px] bg-green-100 dark:bg-green-900/60 text-green-700 dark:text-green-300 font-medium px-2 py-0.5 rounded-full border border-green-200 dark:border-green-800">跨裝置即時傳輸</span>
                    </h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">電腦/手機免密碼即時線上預覽與快速下載</p>
                </div>
            </div>

            <div class="flex items-center gap-2 sm:gap-3">
                <button id="btnNewUpload" class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-xl text-sm font-medium transition flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-plus"></i>
                    <span class="hidden sm:inline">上傳新檔案</span>
                </button>

                <button id="btnThemeToggle" class="p-2 text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition" title="切換深色/淺色模式">
                    <i class="fa-solid fa-moon text-lg" id="themeIcon"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 space-y-6">
        
        <!-- Upload Banner / Dropzone Area -->
        <section id="uploadSection" class="bg-white dark:bg-slate-800 border-2 border-dashed border-slate-300 dark:border-slate-700 hover:border-blue-500 dark:hover:border-blue-400 rounded-2xl p-6 sm:p-10 text-center transition duration-200 cursor-pointer shadow-sm relative overflow-hidden group">
            <input type="file" id="fileInput" class="hidden" multiple>
            
            <div class="max-w-md mx-auto pointer-events-none">
                <div class="w-16 h-16 bg-blue-50 dark:bg-slate-700 text-blue-600 dark:text-blue-400 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner group-hover:scale-110 transition duration-200">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                </div>
                <h2 class="text-lg font-bold mb-1">點擊或拖放檔案至此處上傳</h2>
                <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mb-4">支援圖片、PDF、DOCX、影片音訊、TXT 文字檔等，免登入無限制</p>
                
                <div class="inline-flex items-center gap-2 px-4 py-2 bg-blue-50 dark:bg-slate-700/60 text-blue-700 dark:text-blue-300 rounded-lg text-xs font-semibold">
                    <i class="fa-solid fa-eye"></i>
                    <span>支援線上即時預覽 + 手機掃碼/網址專屬下載</span>
                </div>
            </div>

            <!-- Uploading Progress Overlay -->
            <div id="uploadProgressContainer" class="absolute inset-0 bg-white/95 dark:bg-slate-800/95 backdrop-blur flex flex-col items-center justify-center p-6 hidden z-20">
                <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-3"></div>
                <p id="uploadStatusText" class="font-semibold text-slate-800 dark:text-slate-100 text-sm mb-2">正在處理上傳檔案...</p>
                <div class="w-full max-w-xs bg-slate-200 dark:bg-slate-700 h-2 rounded-full overflow-hidden">
                    <div id="progressBar" class="bg-blue-600 h-full w-0 transition-all duration-200"></div>
                </div>
            </div>
        </section>

        <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
            <!-- Category Tabs -->
            <div class="flex items-center gap-1 overflow-x-auto pb-1 sm:pb-0 scrollbar-none text-xs sm:text-sm">
                <button data-category="all" class="cat-btn bg-blue-600 text-white px-3 py-1.5 rounded-lg font-medium whitespace-nowrap transition">全部檔案</button>
                <button data-category="doc" class="cat-btn text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 px-3 py-1.5 rounded-lg font-medium whitespace-nowrap transition">文件 / PDF</button>
                <button data-category="image" class="cat-btn text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 px-3 py-1.5 rounded-lg font-medium whitespace-nowrap transition">圖片</button>
                <button data-category="media" class="cat-btn text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 px-3 py-1.5 rounded-lg font-medium whitespace-nowrap transition">影音播放</button>
                <button data-category="archive" class="cat-btn text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 px-3 py-1.5 rounded-lg font-medium whitespace-nowrap transition">壓縮檔</button>
            </div>

            <!-- Search Box -->
            <div class="relative flex-1 sm:max-w-xs">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                <input type="text" id="searchInput" placeholder="搜尋檔名..." class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 pl-9 pr-3 py-1.5 rounded-lg text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800 dark:text-slate-100">
            </div>
        </div>

        <!-- File List Grid Container -->
        <div id="fileListGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

        <!-- Empty State Container -->
        <div id="emptyState" class="text-center py-16 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm hidden">
            <div class="w-16 h-16 bg-slate-100 dark:bg-slate-700 text-slate-400 rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl">
                <i class="fa-solid fa-folder-open"></i>
            </div>
            <h3 class="font-bold text-slate-700 dark:text-slate-200 text-base mb-1">目前沒有任何檔案</h3>
            <p class="text-xs text-slate-400">點擊上方按鈕上傳檔案，上傳後即可取得線上預覽、手機 QR Code 與下載連結</p>
        </div>

    </main>

    <!-- 1. FILE PREVIEW MODAL (全功能預覽視窗) -->
    <div id="previewModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-4xl w-full max-h-[90vh] shadow-2xl border border-slate-200 dark:border-slate-700 flex flex-col overflow-hidden">
            
            <!-- Preview Modal Header -->
            <div class="px-5 py-4 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between bg-slate-50/50 dark:bg-slate-800/50">
                <div class="flex items-center gap-3 min-w-0">
                    <div id="previewHeaderIcon" class="w-8 h-8 rounded-lg bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-300 flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-eye"></i>
                    </div>
                    <div class="min-w-0">
                        <h3 id="previewModalTitle" class="font-bold text-sm sm:text-base text-slate-800 dark:text-slate-100 truncate">預覽檔案</h3>
                        <p id="previewModalSubtitle" class="text-xs text-slate-400 truncate">大小未知</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-2">
                    <button id="btnPreviewDownload" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-semibold transition flex items-center gap-1.5 shadow-md">
                        <i class="fa-solid fa-download"></i>
                        <span>立即下載此檔案</span>
                    </button>
                    <button id="btnClosePreview" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>
            </div>

            <!-- Preview Content Body -->
            <div id="previewModalBody" class="p-6 overflow-y-auto flex-1 flex items-center justify-center min-h-[300px] bg-slate-100/50 dark:bg-slate-900/50">
                <!-- Dynamic Content (Image / Video / Audio / PDF / Text / Fallback Card) rendered via JS -->
            </div>
        </div>
    </div>

    <!-- 2. QR CODE & FILE SHARE MODAL (跨裝置分享視窗) -->
    <div id="qrModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 max-w-md w-full shadow-2xl border border-slate-200 dark:border-slate-700 text-center relative">
            <button id="btnCloseQr" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <div class="w-10 h-10 bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-300 rounded-xl flex items-center justify-center mx-auto mb-3">
                <i class="fa-solid fa-qrcode text-lg"></i>
            </div>
            <h3 id="qrModalTitle" class="font-bold text-base mb-1 truncate px-4">檔案名稱</h3>
            <p class="text-xs text-slate-500 dark:text-slate-400 mb-4">手機用相機掃描下方 QR Code，即可直接下載此檔案</p>
            
            <!-- QR Code Container -->
            <div class="bg-white p-4 rounded-xl inline-block border border-slate-200 shadow-inner mb-4">
                <div id="qrcodeCanvas"></div>
            </div>

            <!-- Copyable URL Input for Desktop/Mobile Users -->
            <div class="mb-4 text-left">
                <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">專屬下載網址（電腦/手機通用）：</label>
                <div class="flex items-center gap-2">
                    <input type="text" id="shareUrlInput" readonly class="w-full bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg px-3 py-2 text-xs text-slate-800 dark:text-slate-100 focus:outline-none font-mono">
                    <button id="btnCopyModalLink" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg text-xs font-medium transition whitespace-nowrap flex items-center gap-1 shrink-0">
                        <i class="fa-solid fa-copy"></i>
                        <span>複製網址</span>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between pt-3 border-t border-slate-100 dark:border-slate-700">
                <button id="btnModalPreview" class="px-3.5 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-lg text-xs font-medium transition flex items-center gap-1.5">
                    <i class="fa-solid fa-eye"></i>
                    <span>線上預覽</span>
                </button>
                <button id="btnModalDirectDownload" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-semibold transition flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-download"></i>
                    <span>立即下載</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-800 text-white text-xs sm:text-sm px-4 py-3 rounded-xl shadow-xl opacity-0 transition-opacity duration-300 pointer-events-none z-50 flex items-center gap-2.5">
        <i id="toastIcon" class="fa-solid fa-circle-info text-blue-400"></i>
        <span id="toastMsg">提示訊息</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, updateDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global State & Config Setup
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'public-file-share-app';
        let db = null;
        let auth = null;
        let currentUser = null;

        // Local In-Memory Store
        let localFiles = [];
        let activeCategory = 'all';
        let searchQuery = '';
        let currentModalFile = null;
        let hasHandledUrlFile = false;

        // DOM Elements
        const fileInput = document.getElementById('fileInput');
        const uploadSection = document.getElementById('uploadSection');
        const btnNewUpload = document.getElementById('btnNewUpload');
        const fileListGrid = document.getElementById('fileListGrid');
        const emptyState = document.getElementById('emptyState');
        const searchInput = document.getElementById('searchInput');
        
        // Share Modal Elements
        const qrModal = document.getElementById('qrModal');
        const btnCloseQr = document.getElementById('btnCloseQr');
        const qrcodeCanvas = document.getElementById('qrcodeCanvas');
        const shareUrlInput = document.getElementById('shareUrlInput');
        const btnCopyModalLink = document.getElementById('btnCopyModalLink');
        const btnModalDirectDownload = document.getElementById('btnModalDirectDownload');
        const btnModalPreview = document.getElementById('btnModalPreview');

        // Preview Modal Elements
        const previewModal = document.getElementById('previewModal');
        const btnClosePreview = document.getElementById('btnClosePreview');
        const previewModalTitle = document.getElementById('previewModalTitle');
        const previewModalSubtitle = document.getElementById('previewModalSubtitle');
        const previewModalBody = document.getElementById('previewModalBody');
        const btnPreviewDownload = document.getElementById('btnPreviewDownload');
        const previewHeaderIcon = document.getElementById('previewHeaderIcon');

        // Upload progress DOM
        const uploadProgressContainer = document.getElementById('uploadProgressContainer');
        const progressBar = document.getElementById('progressBar');
        const uploadStatusText = document.getElementById('uploadStatusText');

        async function initCloudEngine() {
            try {
                let firebaseConfig = null;
                if (typeof __firebase_config !== 'undefined') {
                    firebaseConfig = JSON.parse(__firebase_config);
                }

                if (firebaseConfig) {
                    const app = initializeApp(firebaseConfig);
                    auth = getAuth(app);
                    db = getFirestore(app);

                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                    currentUser = auth.currentUser;

                    const filesColRef = collection(db, 'artifacts', appId, 'public', 'data', 'shared_files');
                    onSnapshot(filesColRef, (snapshot) => {
                        const cloudFiles = [];
                        snapshot.forEach(docSnap => {
                            cloudFiles.push({ id: docSnap.id, ...docSnap.data() });
                        });
                        cloudFiles.sort((a, b) => (b.uploadedAt || 0) - (a.uploadedAt || 0));
                        localFiles = cloudFiles;
                        renderFiles();
                        checkUrlForFileShare();
                    }, (error) => {
                        console.warn("Realtime sync warning, fallback to local storage:", error);
                        loadFromLocalStorage();
                        checkUrlForFileShare();
                    });
                } else {
                    loadFromLocalStorage();
                    checkUrlForFileShare();
                }
            } catch (err) {
                console.warn("Cloud initialization note:", err.message);
                loadFromLocalStorage();
                checkUrlForFileShare();
            }
        }

        function setupEventListeners() {
            // Dark mode toggle
            document.getElementById('btnThemeToggle').addEventListener('click', () => {
                const isDark = document.documentElement.classList.toggle('dark');
                document.getElementById('themeIcon').className = isDark ? 'fa-solid fa-sun text-yellow-400' : 'fa-solid fa-moon';
            });

            // Upload triggers
            uploadSection.addEventListener('click', () => fileInput.click());
            btnNewUpload.addEventListener('click', () => fileInput.click());

            uploadSection.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadSection.classList.add('border-blue-500', 'bg-blue-50/50', 'dark:bg-slate-700/50');
            });

            uploadSection.addEventListener('dragleave', () => {
                uploadSection.classList.remove('border-blue-500', 'bg-blue-50/50', 'dark:bg-slate-700/50');
            });

            uploadSection.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadSection.classList.remove('border-blue-500', 'bg-blue-50/50', 'dark:bg-slate-700/50');
                if (e.dataTransfer.files.length > 0) {
                    handleFilesUpload(e.dataTransfer.files);
                }
            });

            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    handleFilesUpload(e.target.files);
                }
            });

            // Category filter tabs
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.cat-btn').forEach(b => {
                        b.className = 'cat-btn text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 px-3 py-1.5 rounded-lg font-medium whitespace-nowrap transition';
                    });
                    btn.className = 'cat-btn bg-blue-600 text-white px-3 py-1.5 rounded-lg font-medium whitespace-nowrap transition';
                    activeCategory = btn.dataset.category;
                    renderFiles();
                });
            });

            // Search filter
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.trim().toLowerCase();
                renderFiles();
            });

            // Share Modal actions
            btnCloseQr.addEventListener('click', () => qrModal.classList.add('hidden'));
            qrModal.addEventListener('click', (e) => {
                if (e.target === qrModal) qrModal.classList.add('hidden');
            });

            btnCopyModalLink.addEventListener('click', () => {
                if (shareUrlInput.value) {
                    copyToClipboard(shareUrlInput.value);
                    showToast('已複製專屬下載網址！可以直接發給電腦或手機好友', 'success');
                }
            });

            btnModalDirectDownload.addEventListener('click', () => {
                if (currentModalFile) {
                    triggerDownload(currentModalFile);
                }
            });

            btnModalPreview.addEventListener('click', () => {
                if (currentModalFile) {
                    qrModal.classList.add('hidden');
                    openPreviewModal(currentModalFile);
                }
            });

            // Preview Modal actions
            btnClosePreview.addEventListener('click', () => previewModal.classList.add('hidden'));
            previewModal.addEventListener('click', (e) => {
                if (e.target === previewModal) previewModal.classList.add('hidden');
            });

            btnPreviewDownload.addEventListener('click', () => {
                if (currentModalFile) {
                    triggerDownload(currentModalFile);
                }
            });
        }

        async function handleFilesUpload(filesList) {
            uploadProgressContainer.classList.remove('hidden');
            const totalFiles = filesList.length;
            let lastUploadedFile = null;

            for (let i = 0; i < totalFiles; i++) {
                const file = filesList[i];
                uploadStatusText.innerText = `正在處理 (${i + 1}/${totalFiles}): ${file.name}`;
                progressBar.style.width = `${((i + 1) / totalFiles) * 100}%`;

                try {
                    const dataUrl = await readFileAsDataUrl(file);
                    const category = detectCategory(file.name, file.type);
                    
                    const newFileRecord = {
                        name: file.name,
                        size: file.size,
                        type: file.type || 'application/octet-stream',
                        category: category,
                        uploadedAt: Date.now(),
                        downloads: 0,
                        dataUrl: dataUrl
                    };

                    if (db) {
                        const filesColRef = collection(db, 'artifacts', appId, 'public', 'data', 'shared_files');
                        const docRef = await addDoc(filesColRef, newFileRecord);
                        newFileRecord.id = docRef.id;
                    } else {
                        newFileRecord.id = 'local_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
                        localFiles.unshift(newFileRecord);
                        saveToLocalStorage();
                    }
                    lastUploadedFile = newFileRecord;
                } catch (err) {
                    showToast(`檔案 ${file.name} 上傳失敗: ` + err.message, 'error');
                }
            }

            setTimeout(() => {
                uploadProgressContainer.classList.add('hidden');
                progressBar.style.width = '0%';
                fileInput.value = '';
                showToast('檔案上傳成功！所有人均可開放預覽與下載。', 'success');
                if (!db) renderFiles();

                if (lastUploadedFile) {
                    showQrCodeModal(lastUploadedFile);
                }
            }, 400);
        }

        function openPreviewModal(file) {
            currentModalFile = file;
            previewModalTitle.innerText = file.name;
            previewModalSubtitle.innerText = `${formatBytes(file.size)} • ${file.type || '未知格式'}`;
            
            const iconMeta = getFileIcon(file.name, file.type);
            previewHeaderIcon.className = `w-8 h-8 rounded-lg ${iconMeta.bgColor} ${iconMeta.textColor} flex items-center justify-center shrink-0`;
            previewHeaderIcon.innerHTML = `<i class="${iconMeta.icon}"></i>`;

            previewModalBody.innerHTML = '';
            const category = detectCategory(file.name, file.type);
            const ext = file.name.split('.').pop().toLowerCase();

            // 1. IMAGE PREVIEW
            if (category === 'image' || file.type.startsWith('image/')) {
                const img = document.createElement('img');
                img.src = file.dataUrl;
                img.alt = file.name;
                img.className = 'max-h-[70vh] max-w-full object-contain rounded-xl shadow-md border border-slate-200 dark:border-slate-700';
                previewModalBody.appendChild(img);
            } 
            // 2. VIDEO PREVIEW
            else if (['mp4', 'webm', 'mov', 'mkv', 'ogg'].includes(ext) || file.type.startsWith('video/')) {
                const video = document.createElement('video');
                video.src = file.dataUrl;
                video.controls = true;
                video.autoplay = false;
                video.className = 'max-h-[70vh] w-full max-w-3xl rounded-xl shadow-md';
                previewModalBody.appendChild(video);
            }
            // 3. AUDIO PREVIEW
            else if (['mp3', 'wav', 'ogg', 'm4a', 'flac'].includes(ext) || file.type.startsWith('audio/')) {
                const audioContainer = document.createElement('div');
                audioContainer.className = 'bg-white dark:bg-slate-800 p-8 rounded-2xl border border-slate-200 dark:border-slate-700 max-w-md w-full text-center shadow-md';
                audioContainer.innerHTML = `
                    <div class="w-20 h-20 bg-amber-100 dark:bg-amber-900/40 text-amber-600 dark:text-amber-400 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                        <i class="fa-solid fa-music"></i>
                    </div>
                    <h4 class="font-bold text-base text-slate-800 dark:text-slate-100 mb-2 truncate">${escapeHtml(file.name)}</h4>
                    <audio controls src="${file.dataUrl}" class="w-full mt-4"></audio>
                `;
                previewModalBody.appendChild(audioContainer);
            }
            // 4. PDF PREVIEW
            else if (ext === 'pdf' || file.type === 'application/pdf') {
                const iframe = document.createElement('iframe');
                iframe.src = file.dataUrl;
                iframe.className = 'w-full h-[70vh] rounded-xl border border-slate-200 dark:border-slate-700 shadow-inner bg-white';
                previewModalBody.appendChild(iframe);
            }
            // 5. TEXT / CODE PREVIEW
            else if (['txt', 'json', 'js', 'html', 'css', 'py', 'md', 'csv', 'xml', 'log'].includes(ext) || file.type.startsWith('text/')) {
                const rawText = decodeDataUrlToText(file.dataUrl);
                const pre = document.createElement('pre');
                pre.className = 'w-full max-h-[65vh] p-4 bg-slate-900 text-emerald-400 rounded-xl overflow-auto text-xs sm:text-sm font-mono border border-slate-700 shadow-inner leading-relaxed select-text';
                pre.innerText = rawText || '（空白檔案或無法解碼文字內容）';
                previewModalBody.appendChild(pre);
            }
            // 6. GENERIC FALLBACK FOR OTHER FILE TYPES
            else {
                const fallbackCard = document.createElement('div');
                fallbackCard.className = 'text-center p-8 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 max-w-sm shadow-sm';
                fallbackCard.innerHTML = `
                    <div class="w-16 h-16 ${iconMeta.bgColor} ${iconMeta.textColor} rounded-2xl flex items-center justify-center mx-auto mb-3 text-3xl">
                        <i class="${iconMeta.icon}"></i>
                    </div>
                    <h4 class="font-bold text-slate-800 dark:text-slate-100 mb-1 truncate">${escapeHtml(file.name)}</h4>
                    <p class="text-xs text-slate-400 mb-4">點擊下方按鈕即可開始將此檔案下載至你的裝置。</p>
                    <button class="btn-fallback-dl px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-semibold shadow transition inline-flex items-center gap-2">
                        <i class="fa-solid fa-download"></i>
                        <span>立即下載此檔案</span>
                    </button>
                `;
                fallbackCard.querySelector('.btn-fallback-dl').addEventListener('click', () => triggerDownload(file));
                previewModalBody.appendChild(fallbackCard);
            }

            previewModal.classList.remove('hidden');
        }

        function showQrCodeModal(file) {
            currentModalFile = file;
            document.getElementById('qrModalTitle').innerText = file.name;
            qrcodeCanvas.innerHTML = '';

            const baseUrl = window.location.origin + window.location.pathname;
            // Add action=download parameter so scanned phone directly receives file download option
            const shareUrl = `${baseUrl}?fileId=${encodeURIComponent(file.id)}&action=download`;
            shareUrlInput.value = shareUrl;

            new QRCode(qrcodeCanvas, {
                text: shareUrl,
                width: 170,
                height: 170,
                colorDark: "#0f172a",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            qrModal.classList.remove('hidden');
        }

        function checkUrlForFileShare() {
            if (hasHandledUrlFile) return;
            const urlParams = new URLSearchParams(window.location.search);
            const targetFileId = urlParams.get('fileId');
            const action = urlParams.get('action');

            if (targetFileId && localFiles.length > 0) {
                const targetFile = localFiles.find(f => f.id === targetFileId);
                if (targetFile) {
                    hasHandledUrlFile = true;
                    currentModalFile = targetFile;
                    
                    // Open Preview/Download Modal directly on mobile/target device
                    openPreviewModal(targetFile);
                    showToast(`已成功獲取分享檔案：${targetFile.name}`, 'success');

                    // If user came through QR Code download action, trigger direct download automatically
                    if (action === 'download') {
                        setTimeout(() => {
                            triggerDownload(targetFile);
                        }, 500);
                    }
                } else {
                    showToast('找不到該分享檔案，可能已被原作者刪除', 'error');
                }
            }
        }

        function copyToClipboard(text) {
            const tempInput = document.createElement('textarea');
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
        }

        function renderFiles() {
            if (!fileListGrid) return;
            fileListGrid.innerHTML = '';

            let filtered = localFiles.filter(file => {
                const matchCategory = activeCategory === 'all' || file.category === activeCategory;
                const matchSearch = !searchQuery || file.name.toLowerCase().includes(searchQuery);
                return matchCategory && matchSearch;
            });

            if (filtered.length === 0) {
                if (emptyState) emptyState.classList.remove('hidden');
                return;
            } else {
                if (emptyState) emptyState.classList.add('hidden');
            }

            filtered.forEach(file => {
                const card = document.createElement('div');
                card.className = 'bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-4 file-card-hover flex flex-col justify-between shadow-sm hover:shadow-md';

                const iconMeta = getFileIcon(file.name, file.type);
                const formattedSize = formatBytes(file.size);
                const formattedDate = new Date(file.uploadedAt).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });

                card.innerHTML = `
                    <div>
                        <div class="flex items-start justify-between gap-3 mb-3">
                            <div class="flex items-center gap-3 min-w-0">
                                <div class="w-12 h-12 ${iconMeta.bgColor} ${iconMeta.textColor} rounded-xl flex items-center justify-center shrink-0 text-xl shadow-inner">
                                    <i class="${iconMeta.icon}"></i>
                                </div>
                                <div class="min-w-0">
                                    <h4 class="font-bold text-sm text-slate-800 dark:text-slate-100 truncate cursor-pointer hover:text-blue-600 transition btn-title-preview" title="點擊預覽 ${escapeHtml(file.name)}">${escapeHtml(file.name)}</h4>
                                    <div class="text-xs text-slate-400 mt-0.5 flex items-center gap-2">
                                        <span>${formattedSize}</span>
                                        <span>•</span>
                                        <span>${formattedDate}</span>
                                    </div>
                                </div>
                            </div>
                            <button data-id="${file.id}" class="btn-delete text-slate-300 hover:text-red-500 p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition" title="刪除檔案">
                                <i class="fa-solid fa-trash-can text-sm"></i>
                            </button>
                        </div>
                    </div>

                    <div class="pt-3 border-t border-slate-100 dark:border-slate-700/60 flex items-center justify-between gap-2 text-xs">
                        <div class="text-slate-400 flex items-center gap-1">
                            <i class="fa-solid fa-download text-[10px]"></i>
                            <span>${file.downloads || 0} 次下載</span>
                        </div>

                        <div class="flex items-center gap-1.5">
                            <button data-id="${file.id}" class="btn-preview p-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 rounded-lg transition" title="線上預覽檔案">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                            <button data-id="${file.id}" class="btn-qr p-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 rounded-lg transition" title="手機掃碼/分享連結 (QR Code)">
                                <i class="fa-solid fa-qrcode"></i>
                            </button>
                            <button data-id="${file.id}" class="btn-download px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-medium transition flex items-center gap-1.5 shadow-sm">
                                <i class="fa-solid fa-download"></i>
                                <span>下載</span>
                            </button>
                        </div>
                    </div>
                `;

                card.querySelector('.btn-title-preview').addEventListener('click', () => openPreviewModal(file));
                card.querySelector('.btn-preview').addEventListener('click', () => openPreviewModal(file));
                card.querySelector('.btn-download').addEventListener('click', () => triggerDownload(file));
                card.querySelector('.btn-qr').addEventListener('click', () => showQrCodeModal(file));
                card.querySelector('.btn-delete').addEventListener('click', () => deleteFileRecord(file));

                fileListGrid.appendChild(card);
            });
        }

        function triggerDownload(file) {
            file.downloads = (file.downloads || 0) + 1;
            
            if (db && file.id && !file.id.startsWith('local_')) {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'shared_files', file.id);
                updateDoc(docRef, { downloads: file.downloads }).catch(() => {});
            } else {
                saveToLocalStorage();
            }

            // Universal Blob URL Download Strategy
            try {
                const blob = dataUrlToBlob(file.dataUrl);
                const blobUrl = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = file.name;
                document.body.appendChild(a);
                a.click();
                
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(blobUrl);
                }, 200);

                showToast(`已開始下載檔案：${file.name}`, 'success');
            } catch (e) {
                // Direct Data URL fallback
                const a = document.createElement('a');
                a.href = file.dataUrl;
                a.download = file.name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                showToast(`已開始下載檔案：${file.name}`, 'success');
            }

            renderFiles();
        }

        async function deleteFileRecord(file) {
            if (db && file.id && !file.id.startsWith('local_')) {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'shared_files', file.id);
                    await deleteDoc(docRef);
                    showToast('檔案已成功刪除', 'info');
                } catch (e) {
                    showToast('刪除失敗: ' + e.message, 'error');
                }
            } else {
                localFiles = localFiles.filter(f => f.id !== file.id);
                saveToLocalStorage();
                renderFiles();
                showToast('檔案已刪除', 'info');
            }
        }

        function detectCategory(fileName, mimeType) {
            const ext = fileName.split('.').pop().toLowerCase();
            if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'bmp'].includes(ext) || mimeType.startsWith('image/')) {
                return 'image';
            }
            if (['pdf', 'doc', 'docx', 'txt', 'xls', 'xlsx', 'ppt', 'pptx', 'csv', 'md', 'json'].includes(ext)) {
                return 'doc';
            }
            if (['mp3', 'wav', 'mp4', 'mkv', 'mov', 'avi', 'ogg', 'webm', 'flac'].includes(ext) || mimeType.startsWith('video/') || mimeType.startsWith('audio/')) {
                return 'media';
            }
            if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) {
                return 'archive';
            }
            return 'all';
        }

        function getFileIcon(fileName, mimeType) {
            const ext = fileName.split('.').pop().toLowerCase();
            
            if (['pdf'].includes(ext)) {
                return { icon: 'fa-solid fa-file-pdf', bgColor: 'bg-red-50 dark:bg-red-950/40', textColor: 'text-red-600 dark:text-red-400' };
            }
            if (['doc', 'docx'].includes(ext)) {
                return { icon: 'fa-solid fa-file-word', bgColor: 'bg-blue-50 dark:bg-blue-950/40', textColor: 'text-blue-600 dark:text-blue-400' };
            }
            if (['xls', 'xlsx', 'csv'].includes(ext)) {
                return { icon: 'fa-solid fa-file-excel', bgColor: 'bg-green-50 dark:bg-green-950/40', textColor: 'text-green-600 dark:text-green-400' };
            }
            if (['ppt', 'pptx'].includes(ext)) {
                return { icon: 'fa-solid fa-file-powerpoint', bgColor: 'bg-orange-50 dark:bg-orange-950/40', textColor: 'text-orange-600 dark:text-orange-400' };
            }
            if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'].includes(ext) || mimeType.startsWith('image/')) {
                return { icon: 'fa-solid fa-file-image', bgColor: 'bg-purple-50 dark:bg-purple-950/40', textColor: 'text-purple-600 dark:text-purple-400' };
            }
            if (['mp3', 'wav', 'ogg', 'flac'].includes(ext) || mimeType.startsWith('audio/')) {
                return { icon: 'fa-solid fa-file-audio', bgColor: 'bg-amber-50 dark:bg-amber-950/40', textColor: 'text-amber-600 dark:text-amber-400' };
            }
            if (['mp4', 'mkv', 'mov', 'avi', 'webm'].includes(ext) || mimeType.startsWith('video/')) {
                return { icon: 'fa-solid fa-file-video', bgColor: 'bg-rose-50 dark:bg-rose-950/40', textColor: 'text-rose-600 dark:text-rose-400' };
            }
            if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) {
                return { icon: 'fa-solid fa-file-zipper', bgColor: 'bg-slate-100 dark:bg-slate-700', textColor: 'text-slate-600 dark:text-slate-300' };
            }
            if (['txt', 'json', 'js', 'html', 'css', 'py', 'md'].includes(ext)) {
                return { icon: 'fa-solid fa-file-code', bgColor: 'bg-indigo-50 dark:bg-indigo-950/40', textColor: 'text-indigo-600 dark:text-indigo-400' };
            }
            return { icon: 'fa-solid fa-file', bgColor: 'bg-slate-100 dark:bg-slate-700', textColor: 'text-slate-500 dark:text-slate-400' };
        }

        function readFileAsDataUrl(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = (err) => reject(err);
                reader.readAsDataURL(file);
            });
        }

        function dataUrlToBlob(dataUrl) {
            const arr = dataUrl.split(',');
            const mime = arr[0].match(/:(.*?);/)[1];
            const bstr = atob(arr[1]);
            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while (n--) {
                u8arr[n] = bstr.charCodeAt(n);
            }
            return new Blob([u8arr], { type: mime });
        }

        function decodeDataUrlToText(dataUrl) {
            try {
                const base64Str = dataUrl.split(',')[1];
                return decodeURIComponent(escape(atob(base64Str)));
            } catch (e) {
                return '';
            }
        }

        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.innerText = message;
            if (type === 'success') {
                toastIcon.className = 'fa-solid fa-circle-check text-green-400';
            } else if (type === 'error') {
                toastIcon.className = 'fa-solid fa-circle-exclamation text-red-400';
            } else {
                toastIcon.className = 'fa-solid fa-circle-info text-blue-400';
            }

            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }

        function saveToLocalStorage() {
            try {
                localStorage.setItem('shared_files_local', JSON.stringify(localFiles));
            } catch (e) {
                console.warn('LocalStorage limit reached');
            }
        }

        function loadFromLocalStorage() {
            try {
                const stored = localStorage.getItem('shared_files_local');
                if (stored) {
                    localFiles = JSON.parse(stored);
                    renderFiles();
                }
            } catch (e) {}
        }

        // App Initialization on Window Load
        window.addEventListener('DOMContentLoaded', () => {
            setupEventListeners();
            initCloudEngine();
        });
    </script>
</body>
</html>
