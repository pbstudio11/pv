<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>線上 EPUB 電子書製作與打包工坊</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- JSZip (用於動態打包 EPUB 結構) -->
    <script src="https://cdn.jsdelivr.net/npm/jszip/3.10.1/jszip.min.js"></script>

    <!-- Marked (選用：支援 Markdown 即時轉換為章節內容) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col font-sans">

    <!-- 頂部導覽列 -->
    <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-4 sm:px-6 py-4 flex items-center justify-between shadow-sm sticky top-0 z-30 flex-wrap gap-4">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center shadow-md shrink-0">
                <i class="fa-solid fa-book-pen text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight" data-i18n="appTitle">EPUB 電子書線上製作工坊</h1>
                <p class="text-xs text-gray-500 dark:text-gray-400 hidden sm:block" data-i18n="appDesc">手動建立書本中繼資料、多章節與自訂圖片，一鍵打包下載 .epub</p>
            </div>
        </div>

        <div class="flex items-center space-x-2 sm:space-x-3">
            <!-- 介面語系切換器 -->
            <div class="relative">
                <select id="ui-lang-select" class="pl-3 pr-7 py-2 rounded-xl bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-xs sm:text-sm font-medium transition cursor-pointer appearance-none border-0 focus:ring-2 focus:ring-indigo-500 text-gray-700 dark:text-gray-200">
                    <option value="zh">繁體中文</option>
                    <option value="en">English</option>
                    <option value="ja">日本語</option>
                </select>
                <i class="fa-solid fa-chevron-down absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 text-[10px] pointer-events-none"></i>
            </div>

            <button id="preview-book-btn" class="px-3 sm:px-4 py-2 rounded-xl bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-xs sm:text-sm font-medium transition flex items-center space-x-2">
                <i class="fa-solid fa-eye text-indigo-500"></i>
                <span data-i18n="previewBtn" class="hidden sm:inline">預覽書籍結構</span>
            </button>
            <button id="export-epub-btn" class="px-3 sm:px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-bold shadow-lg shadow-indigo-600/20 transition flex items-center space-x-2">
                <i class="fa-solid fa-file-arrow-down"></i>
                <span data-i18n="exportBtn" class="hidden sm:inline">打包下載 EPUB</span>
            </button>
        </div>
    </header>

    <!-- 主要操作區 -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- 左側：書籍資訊與章節清單側邊欄 (4格寬) -->
        <div class="lg:col-span-4 flex flex-col space-y-6">
            
            <!-- 書籍基本設定卡片 -->
            <div class="bg-white dark:bg-gray-800 rounded-2xl p-5 border border-gray-200 dark:border-gray-700 shadow-sm">
                <h2 class="font-bold text-sm text-gray-700 dark:text-gray-300 mb-4 flex items-center space-x-2">
                    <i class="fa-solid fa-circle-info text-indigo-500"></i>
                    <span data-i18n="metaTitle">1. 書籍基本中繼資料</span>
                </h2>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1" data-i18n="bookTitleLabel">書名 (Title)</label>
                        <input type="text" id="meta-title" class="w-full text-sm bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1" data-i18n="bookAuthorLabel">作者 (Creator)</label>
                        <input type="text" id="meta-author" class="w-full text-sm bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1" data-i18n="bookLangLabel">語言 (Language)</label>
                        <select id="meta-lang" class="w-full text-sm bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500">
                            <option value="zh-TW">繁體中文 (zh-TW)</option>
                            <option value="zh-CN">簡體中文 (zh-CN)</option>
                            <option value="en">英文 (en)</option>
                            <option value="ja">日文 (ja)</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 章節管理卡片 -->
            <div class="bg-white dark:bg-gray-800 rounded-2xl p-5 border border-gray-200 dark:border-gray-700 shadow-sm flex-1 flex flex-col">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="font-bold text-sm text-gray-700 dark:text-gray-300 flex items-center space-x-2">
                        <i class="fa-solid fa-list-ul text-indigo-500"></i>
                        <span data-i18n="chapterMgmtTitle">2. 章節目錄管理</span>
                    </h2>
                    <button id="add-chapter-btn" class="px-3 py-1.5 bg-indigo-50 dark:bg-indigo-900/40 hover:bg-indigo-100 text-indigo-600 dark:text-indigo-400 rounded-xl text-xs font-bold transition flex items-center space-x-1">
                        <i class="fa-solid fa-plus"></i>
                        <span data-i18n="addChapterBtn">新增章節</span>
                    </button>
                </div>

                <!-- 章節拖曳/點擊清單 -->
                <div id="chapter-list" class="space-y-2 overflow-y-auto max-h-[350px] no-scrollbar flex-1">
                    <!-- 動態生成章節項目 -->
                </div>
            </div>
        </div>

        <!-- 右側：當前選中章節的編輯與排版區 (8格寬) -->
        <div class="lg:col-span-8 bg-white dark:bg-gray-800 rounded-2xl p-6 border border-gray-200 dark:border-gray-700 shadow-sm flex flex-col">
            <div class="flex items-center justify-between pb-4 border-b border-gray-100 dark:border-gray-700 mb-4">
                <div class="flex items-center space-x-3 flex-1 mr-4">
                    <span class="text-xs font-bold text-gray-400 whitespace-nowrap" data-i18n="chapTitlePrefix">章節標題：</span>
                    <input type="text" id="current-chapter-title" data-i18n-placeholder="chapTitlePlaceholder" class="font-bold text-base bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl px-3 py-1.5 w-full focus:outline-none focus:border-indigo-500" placeholder="請輸入章節標題">
                </div>
                <button id="delete-chapter-btn" class="text-gray-400 hover:text-rose-500 p-2 rounded-xl transition" title="刪除此章節">
                    <i class="fa-solid fa-trash-can text-sm"></i>
                </button>
            </div>

            <!-- 工具列：插入圖片與格式化按鈕 -->
            <div class="flex items-center space-x-2 mb-3 bg-gray-50 dark:bg-gray-900/60 p-2 rounded-xl border border-gray-200 dark:border-gray-700 flex-wrap gap-2">
                <label class="cursor-pointer px-3 py-1.5 bg-white dark:bg-gray-800 hover:bg-gray-100 border border-gray-200 dark:border-gray-700 rounded-lg text-xs font-medium transition flex items-center space-x-1.5 shadow-sm">
                    <i class="fa-solid fa-image text-indigo-500"></i>
                    <span data-i18n="insertImageBtn">插入圖片</span>
                    <input type="file" id="image-upload-input" accept="image/*" class="hidden">
                </label>
                <button id="insert-p-tag" class="px-3 py-1.5 bg-white dark:bg-gray-800 hover:bg-gray-100 border border-gray-200 dark:border-gray-700 rounded-lg text-xs font-medium transition shadow-sm flex items-center space-x-1">
                    <i class="fa-solid fa-paragraph text-indigo-500"></i><span data-i18n="insertPBtn">段落 &lt;p&gt;</span>
                </button>
                <button id="insert-h2-tag" class="px-3 py-1.5 bg-white dark:bg-gray-800 hover:bg-gray-100 border border-gray-200 dark:border-gray-700 rounded-lg text-xs font-medium transition shadow-sm flex items-center space-x-1">
                    <i class="fa-solid fa-heading text-indigo-500"></i><span data-i18n="insertH2Btn">標題 &lt;h2&gt;</span>
                </button>
                <button id="insert-b-tag" class="px-3 py-1.5 bg-white dark:bg-gray-800 hover:bg-gray-100 border border-gray-200 dark:border-gray-700 rounded-lg text-xs font-medium transition shadow-sm flex items-center space-x-1">
                    <i class="fa-solid fa-bold text-indigo-500"></i><span data-i18n="insertBBtn">粗體 &lt;b&gt;</span>
                </button>
                <div class="text-[11px] text-gray-400 ml-auto hidden md:block" data-i18n="htmlHint">支援選取文字快速包覆標籤</div>
            </div>

            <!-- 內容編輯器文字輸入框 -->
            <div class="flex-1 flex flex-col">
                <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1" data-i18n="editContentTitle">3. 編寫章節本文內容 (HTML / 文字)</label>
                <textarea id="current-chapter-content" data-i18n-placeholder="editContentPlaceholder" class="w-full flex-1 min-h-[300px] bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl p-4 text-sm font-mono focus:outline-none focus:border-indigo-500 leading-relaxed" placeholder="在此輸入章節內容..."></textarea>
            </div>
        </div>
    </main>

    <!-- 預覽彈跳視窗 -->
    <div id="preview-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-gray-800 rounded-2xl max-w-2xl w-full p-6 border border-gray-700 shadow-2xl flex flex-col max-h-[85vh]">
            <div class="flex items-center justify-between pb-3 border-b border-gray-100 dark:border-gray-700 mb-4">
                <h3 class="font-bold text-base flex items-center space-x-2">
                    <i class="fa-solid fa-book text-indigo-500"></i>
                    <span data-i18n="previewModalTitle">電子書結構速覽</span>
                </h3>
                <button id="close-preview-modal" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div id="preview-content-area" class="flex-1 overflow-y-auto space-y-4 text-sm pr-2">
                <!-- 動態預覽內容 -->
            </div>
        </div>
    </div>

    <!-- Toast 訊息通知 -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 bg-gray-900/90 text-white px-4 py-3 rounded-xl shadow-2xl backdrop-blur-md flex items-center space-x-2 border border-gray-700 transition-all duration-300 transform translate-y-10 opacity-0 hidden">
        <i class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
        <span id="toast-msg" class="text-xs sm:text-sm font-medium">通知訊息</span>
    </div>

        /**
         * EPUB 製作工坊核心邏輯
         */
        class EpubBuilderApp {
            constructor() {
                // 語系設定
                this.currentLang = 'zh';

                this.dom = {
                    uiLangSelect: document.getElementById('ui-lang-select'),
                    metaTitle: document.getElementById('meta-title'),
                    metaAuthor: document.getElementById('meta-author'),
                    metaLang: document.getElementById('meta-lang'),
                    chapterList: document.getElementById('chapter-list'),
                    addChapterBtn: document.getElementById('add-chapter-btn'),
                    currentTitle: document.getElementById('current-chapter-title'),
                    currentContent: document.getElementById('current-chapter-content'),
                    deleteChapterBtn: document.getElementById('delete-chapter-btn'),
                    imageUploadInput: document.getElementById('image-upload-input'),
                    insertPTagBtn: document.getElementById('insert-p-tag'),
                    insertH2TagBtn: document.getElementById('insert-h2-tag'),
                    insertBTagBtn: document.getElementById('insert-b-tag'),
                    exportBtn: document.getElementById('export-epub-btn'),
                    previewBtn: document.getElementById('preview-book-btn'),
                    previewModal: document.getElementById('preview-modal'),
                    closePreviewModal: document.getElementById('close-preview-modal'),
                    previewContentArea: document.getElementById('preview-content-area'),
                    toast: document.getElementById('toast'),
                    toastMsg: document.getElementById('toast-msg')
                };

                // 設定初始中繼資料
                this.dom.metaTitle.value = this.t('defaultBookTitle');
                this.dom.metaAuthor.value = this.t('defaultBookAuthor');

                // 書籍章節資料陣列 (依據初始語系載入預設內容)
                this.chapters = [
                    {
                        id: 'chap_1',
                        title: this.t('chap1Title'),
                        content: this.t('chap1Content')
                    },
                    {
                        id: 'chap_2',
                        title: this.t('chap2Title'),
                        content: this.t('chap2Content')
                    }
                ];
                
                // 圖片資源庫快取 { fileName: { dataUrl, mimeType } }
                this.images = {};
                // 當前選中的章節索引
                this.currentIdx = 0;

                this.initEvents();
                this.updateI18n(); // 初次渲染多語系
                this.renderChapterList();
                this.loadChapterToEditor(0);
            }

            initEvents() {
                // 語系切換器
                this.dom.uiLangSelect.addEventListener('change', (e) => {
                    this.currentLang = e.target.value;
                    this.updateI18n();
                });

                // 章節標題輸入同步
                this.dom.currentTitle.addEventListener('input', (e) => {
                    if (this.chapters[this.currentIdx]) {
                        this.chapters[this.currentIdx].title = e.target.value;
                        this.renderChapterList();
                    }
                });

                // 章節內容輸入同步
                this.dom.currentContent.addEventListener('input', (e) => {
                    if (this.chapters[this.currentIdx]) {
                        this.chapters[this.currentIdx].content = e.target.value;
                    }
                });

                // 新增章節
                this.dom.addChapterBtn.addEventListener('click', () => {
                    const newId = 'chap_' + Date.now();
                    const newIndex = this.chapters.length + 1;
                    this.chapters.push({
                        id: newId,
                        title: this.t('newChapTitle').replace('{n}', newIndex),
                        content: this.t('newChapContent')
                    });
                    this.renderChapterList();
                    this.loadChapterToEditor(this.chapters.length - 1);
                    this.showToast(this.t('toastAddChap'));
                });

                // 刪除章節
            this.dom.deleteChapterBtn.addEventListener('click', () => {
                if (this.chapters.length <= 1) {
                    this.showToast(this.t('toastKeepOne'));
                    return;
                }
                this.chapters.splice(this.currentIdx, 1);
                this.currentIdx = Math.max(0, this.currentIdx - 1);
                this.renderChapterList();
                this.loadChapterToEditor(this.currentIdx);
                this.showToast(this.t('toastDelChap'));
            });

            // 修正游標定位問題的插入標籤輔助函式
            const insertTag = (openTag, closeTag, defaultText) => {
                const textarea = this.dom.currentContent;
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                const val = textarea.value;
                const selectedText = val.substring(start, end) || defaultText;
                
                const insertion = openTag + selectedText + closeTag;
                textarea.value = val.substring(0, start) + insertion + val.substring(end);
                
                // 設定游標位置在插入內容之後或選取文字內部，避免跳至最底
                const newCursorPos = start + insertion.length;
                textarea.setSelectionRange(newCursorPos, newCursorPos);

                if (this.chapters[this.currentIdx]) {
                    this.chapters[this.currentIdx].content = textarea.value;
                }
                textarea.focus();
            };

            // 插入段落標籤
            this.dom.insertPTagBtn.addEventListener('click', () => {
                insertTag('<p>', '</p>', 'text...');
            });

            // 插入 H2 標籤
            this.dom.insertH2TagBtn.addEventListener('click', () => {
                insertTag('<h2>', '</h2>', 'heading...');
            });

            // 插入 B 標籤
            this.dom.insertBTagBtn.addEventListener('click', () => {
                insertTag('<b>', '</b>', 'bold text...');
            });

            // 圖片上傳處理與游標修正
            this.dom.imageUploadInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const dataUrl = event.target.result;
                    const imgFileName = 'img_' + Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9_.-]/g, '');
                    
                    this.images[imgFileName] = {
                        dataUrl: dataUrl,
                        mimeType: file.type || 'image/jpeg'
                    };

                    // 在目前游標處精確插入圖片標籤
                    const textarea = this.dom.currentContent;
                    const pos = textarea.selectionStart;
                    const imgTag = `<div style="text-align:center; margin: 1rem 0;"><img src="images/${imgFileName}" alt="Image" style="max-width:100%; height:auto; border-radius:8px;" /></div>`;
                    
                    textarea.value = textarea.value.substring(0, pos) + imgTag + textarea.value.substring(pos);
                    
                    const newCursorPos = pos + imgTag.length;
                    textarea.setSelectionRange(newCursorPos, newCursorPos);

                    if (this.chapters[this.currentIdx]) {
                        this.chapters[this.currentIdx].content = textarea.value;
                    }

                    this.showToast(this.t('toastInsertImg') + file.name);
                    this.dom.imageUploadInput.value = '';
                    textarea.focus();
                };
                reader.readAsDataURL(file);
            });

            // 打包下載 EPUB
                this.dom.exportBtn.addEventListener('click', () => {
                    this.generateAndDownloadEpub();
                });

                // 預覽按鈕
                this.dom.previewBtn.addEventListener('click', () => {
                    this.openPreviewModal();
                });

                this.dom.closePreviewModal.addEventListener('click', () => {
                    this.dom.previewModal.classList.add('hidden');
                });
            }

            t(key) {
                return i18nDictionary[this.currentLang][key] || key;
            }

            updateI18n() {
                // 更新文字節點
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (i18nDictionary[this.currentLang][key]) {
                        el.textContent = i18nDictionary[this.currentLang][key];
                    }
                });
                // 更新 Placeholder
                document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                    const key = el.getAttribute('data-i18n-placeholder');
                    if (i18nDictionary[this.currentLang][key]) {
                        el.placeholder = i18nDictionary[this.currentLang][key];
                    }
                });
            }

            renderChapterList() {
                const container = this.dom.chapterList;
                container.innerHTML = '';

                this.chapters.forEach((chap, idx) => {
                    const item = document.createElement('div');
                    const isActive = idx === this.currentIdx;
                    item.className = `p-3 rounded-xl border text-xs sm:text-sm font-medium transition cursor-pointer flex items-center justify-between ${
                        isActive ? 
                        'bg-indigo-50 dark:bg-indigo-900/40 border-indigo-500 text-indigo-700 dark:text-indigo-300 shadow-sm' : 
                        'bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-750'
                    }`;

                    item.innerHTML = `
                        <div class="flex items-center space-x-2 truncate">
                            <i class="fa-solid fa-file-lines text-indigo-500"></i>
                            <span class="truncate">${this.escapeHtml(chap.title)}</span>
                        </div>
                        <span class="text-[10px] text-gray-400 font-mono">#${idx + 1}</span>
                    `;

                    item.addEventListener('click', () => {
                        this.loadChapterToEditor(idx);
                    });

                    container.appendChild(item);
                });
            }

            loadChapterToEditor(idx) {
                this.currentIdx = idx;
                const chap = this.chapters[idx];
                if (chap) {
                    this.dom.currentTitle.value = chap.title;
                    this.dom.currentContent.value = chap.content;
                }
                this.renderChapterList();
            }

            escapeHtml(str) {
                return str ? str.replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])) : '';
            }

            showToast(message) {
                if (!this.dom.toast) return;
                this.dom.toastMsg.textContent = message;
                this.dom.toast.classList.remove('hidden', 'translate-y-10', 'opacity-0');
                setTimeout(() => {
                    this.dom.toast.classList.add('translate-y-10', 'opacity-0');
                    setTimeout(() => this.dom.toast.classList.add('hidden'), 300);
                }, 3500);
            }

            openPreviewModal() {
                const area = this.dom.previewContentArea;
                area.innerHTML = '';

                const title = this.dom.metaTitle.value || this.t('unnamedBook');
                const author = this.dom.metaAuthor.value || this.t('unknownAuthor');
                const totalText = this.t('totalChapters').replace('{n}', this.chapters.length);
                const authorPrefix = this.t('authorPrefix');

                let html = `
                    <div class="bg-indigo-50 dark:bg-indigo-900/30 p-4 rounded-xl border border-indigo-200 dark:border-indigo-800 mb-4">
                        <h4 class="font-bold text-indigo-700 dark:text-indigo-300 text-base">${this.escapeHtml(title)}</h4>
                        <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">${authorPrefix}${this.escapeHtml(author)} | ${totalText}</p>
                    </div>
                `;

                this.chapters.forEach((c, i) => {
                    html += `
                        <div class="border border-gray-200 dark:border-gray-700 p-4 rounded-xl space-y-2">
                            <h5 class="font-bold text-sm text-gray-800 dark:text-gray-200">${i + 1}. ${this.escapeHtml(c.title)}</h5>
                            <div class="text-xs text-gray-600 dark:text-gray-300 bg-gray-50 dark:bg-gray-900 p-3 rounded-lg max-h-32 overflow-y-auto">
                                ${c.content}
                            </div>
                        </div>
                    `;
                });

                area.innerHTML = html;
                this.dom.previewModal.classList.remove('hidden');
            }

            /**
             * 核心：修復後的 EPUB 打包邏輯 (確保標準 EPUB 3 相容命名空間與結構與正確的 Base64 處理)
             */
            async generateAndDownloadEpub() {
                try {
                    this.showToast(this.t('toastExporting'));
                    const zip = new JSZip();

                    // 1. mimetype (必須為第一個檔案且無壓縮)
                    zip.file("mimetype", "application/epub+zip", { compression: "STORE" });

                    // 2. META-INF/container.xml
                    const containerXml = `<?xml version="1.0" encoding="UTF-8"?>
<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">
    <rootfiles>
        <rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/>
    </rootfiles>
</container>`;
                    zip.file("META-INF/container.xml", containerXml);

                    // 3. 處理圖片資源檔案加入 OEBPS/images/ (確保 Base64 資料分離正確)
                    const imageManifestItems = [];
                    for (const [imgName, imgObj] of Object.entries(this.images)) {
                        const parts = imgObj.dataUrl.split(',');
                        if (parts.length === 2) {
                            const base64Data = parts[1];
                            zip.file(`OEBPS/images/${imgName}`, base64Data, { base64: true });
                            imageManifestItems.push({
                                id: imgName.replace(/[^a-zA-Z0-9_]/g, '_'),
                                href: `images/${imgName}`,
                                mediaType: imgObj.mimeType || 'image/jpeg'
                            });
                        }
                    }

                    // 4. 生成各章節 XHTML 檔案與 Manifest / Spine
                    let manifestItemsHtml = `
        <item id="ncx" href="toc.ncx" media-type="application/x-dtbncx+xml"/>
        <item id="style" href="style.css" media-type="text/css"/>`;
                    
                    let spineItemsHtml = '';
                    let ncxNavPointsHtml = '';

                    this.chapters.forEach((chap, idx) => {
                        const fileSlug = `chapter_${idx + 1}.xhtml`;
                        const itemId = `chap_${idx + 1}`;
                        
                        const xhtmlContent = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="${this.dom.metaLang.value}">
<head>
    <title>${this.escapeHtml(chap.title)}</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <h1>${this.escapeHtml(chap.title)}</h1>
    ${chap.content || ''}
</body>
</html>`;

                        zip.file(`OEBPS/${fileSlug}`, xhtmlContent);

                        manifestItemsHtml += `\n        <item id="${itemId}" href="${fileSlug}" media-type="application/xhtml+xml"/>`;
                        spineItemsHtml += `\n        <itemref idref="${itemId}"/>`;
                        ncxNavPointsHtml += `
        <navPoint id="navPoint-${idx + 1}" playOrder="${idx + 1}">
            <navLabel><text>${this.escapeHtml(chap.title)}</text></navLabel>
            <content src="${fileSlug}"/>
        </navPoint>`;
                    });

                    imageManifestItems.forEach(img => {
                        manifestItemsHtml += `\n        <item id="${img.id}" href="${img.href}" media-type="${img.mediaType}"/>`;
                    });

                    // 5. OEBPS/style.css
                    const styleCss = `
body { font-family: sans-serif; line-height: 1.6; padding: 1.5rem; color: #333; }
h1 { color: #4f46e5; border-bottom: 2px solid #e0e7ff; padding-bottom: 0.5rem; margin-bottom: 1.5rem; }
h2 { color: #4338ca; margin-top: 1.2rem; margin-bottom: 0.6rem; }
p { margin-bottom: 1rem; }
b, strong { font-weight: bold; }
img { max-width: 100%; height: auto; display: block; margin: 1rem auto; }
`;
                    zip.file("OEBPS/style.css", styleCss);

                    // 6. OEBPS/content.opf
                    const bookTitle = this.dom.metaTitle.value || this.t('unnamedBook');
                    const bookAuthor = this.dom.metaAuthor.value || this.t('unknownAuthor');
                    const bookLang = this.dom.metaLang.value || 'zh-TW';
                    const uuid = 'urn:uuid:' + 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                        const r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                        return v.toString(16);
                    });

                    const contentOpf = `<?xml version="1.0" encoding="UTF-8"?>
<package xmlns="http://www.idpf.org/2007/opf" unique-id="BookId" version="3.0">
    <metadata xmlns:dc="http://purl.org/dc/elements/1.1/">
        <dc:title>${this.escapeHtml(bookTitle)}</dc:title>
        <dc:creator>${this.escapeHtml(bookAuthor)}</dc:creator>
        <dc:language>${bookLang}</dc:language>
        <dc:identifier id="BookId">${uuid}</dc:identifier>
        <meta property="dcterms:modified">${new Date().toISOString().split('.')[0]+'Z'}</meta>
    </metadata>
    <manifest>${manifestItemsHtml}
    </manifest>
    <spine toc="ncx">${spineItemsHtml}
    </spine>
</package>`;
                    zip.file("OEBPS/content.opf", contentOpf);

                    // 7. OEBPS/toc.ncx
                    const tocNcx = `<?xml version="1.0" encoding="UTF-8"?>
<ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1">
    <head>
        <meta name="dtb:uid" content="${uuid}"/>
        <meta name="dtb:depth" content="1"/>
        <meta name="dtb:totalPageCount" content="0"/>
        <meta name="dtb:maxPageNoframes" content="0"/>
    </head>
    <docTitle><text>${this.escapeHtml(bookTitle)}</text></docTitle>
    <navMap>${ncxNavPointsHtml}
    </navMap>
</ncx>`;
                    zip.file("OEBPS/toc.ncx", tocNcx);

                    // 8. 生成 Blob 並觸發下載
                    const content = await zip.generateAsync({ type: "blob" });
                    const blobUrl = URL.createObjectURL(content);
                    
                    const safeFileName = bookTitle.replace(/[^a-zA-Z0-9_\u4e00-\u9fa5]/g, '_');
                    const downloadAnchor = document.createElement('a');
                    downloadAnchor.href = blobUrl;
                    downloadAnchor.download = `${safeFileName}.epub`;
                    document.body.appendChild(downloadAnchor);
                    downloadAnchor.click();
                    document.body.removeChild(downloadAnchor);
                    URL.revokeObjectURL(blobUrl);

                    this.showToast(this.t('toastSuccess'));
                } catch (err) {
                    console.error(err);
                    this.showToast(this.t('toastError'));
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            window.builderApp = new EpubBuilderApp();
        });
    </script>
</body>
</html>
