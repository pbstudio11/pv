<!DOCTYPE html>
<html lang="zh-Hant" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doc & Docx 線上文件閱讀器</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Mammoth.js for DOCX parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <!-- Google Fonts for multilingual CJK text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', 'Noto Sans JP', sans-serif;
        }
        /* Document rendering styles */
        .doc-content {
            line-height: 1.8;
            color: #1f2937;
        }
        .doc-content h1 { font-size: 2em; font-weight: 700; margin-top: 1em; margin-bottom: 0.5em; color: #111827; }
        .doc-content h2 { font-size: 1.5em; font-weight: 600; margin-top: 0.8em; margin-bottom: 0.4em; color: #1f2937; }
        .doc-content h3 { font-size: 1.25em; font-weight: 600; margin-top: 0.6em; margin-bottom: 0.3em; color: #374151; }
        .doc-content p { margin-bottom: 1em; text-align: justify; word-break: break-word; }
        .doc-content table { border-collapse: collapse; width: 100%; margin: 1em 0; }
        .doc-content th, .doc-content td { border: 1px solid #d1d5db; padding: 8px 12px; text-align: left; }
        .doc-content th { background-color: #f3f4f6; font-weight: 600; }
        .doc-content ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 1em; }
        .doc-content ol { list-style-type: decimal; padding-left: 1.5em; margin-bottom: 1em; }
        .doc-content img { max-width: 100%; height: auto; margin: 1em auto; display: block; border-radius: 4px; }
        .doc-content blockquote { border-left: 4px solid #3b82f6; padding-left: 1rem; color: #4b5563; font-style: italic; margin: 1em 0; }
        
        /* Dark mode overrides for document container */
        .dark .doc-content { color: #e5e7eb; }
        .dark .doc-content h1, .dark .doc-content h2, .dark .doc-content h3 { color: #f9fafb; }
        .dark .doc-content th, .dark .doc-content td { border-color: #374151; }
        .dark .doc-content th { background-color: #1f2937; }

        /* Highlight text for search */
        mark.highlight { background-color: #fef08a; color: #000; border-radius: 2px; padding: 0 2px; }

        @media print {
            .no-print { display: none !important; }
            .print-area { box-shadow: none !important; margin: 0 !important; width: 100% !important; max-width: 100% !important; }
        }
    </style>
</head>

<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 h-full flex flex-col transition-colors duration-200">

    <!-- Header Navigation -->
    <header class="no-print bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-4 py-3 sticky top-0 z-30 shadow-sm flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-blue-600 text-white rounded-lg flex items-center justify-center w-10 h-10 shadow-md">
                <i class="fa-solid font-bold text-lg fa-file-word"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight">Doc / Docx 閱讀器</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400">支援 中文 / 日文 / 英文 (.docx & .doc)</p>
            </div>
        </div>

        <div class="flex items-center gap-2 md:gap-3">
            <label for="fileInput" class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-folder-open"></i>
                <span class="hidden sm:inline">選擇檔案</span>
            </label>
            <input type="file" id="fileInput" accept=".doc,.docx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" class="hidden">

            <button id="btnSample" class="bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1.5" title="載入範例文件">
                <i class="fa-solid fa-file-lines text-blue-500"></i>
                <span class="hidden md:inline">試用範例</span>
            </button>

            <button id="btnThemeToggle" class="p-2 text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition" title="切換深色模式">
                <i class="fa-solid fa-moon text-lg" id="themeIcon"></i>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex overflow-hidden">
        
        <aside id="sidebar" class="no-print w-72 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 flex flex-col hidden lg:flex">
            <div class="p-4 border-b border-slate-200 dark:border-slate-700">
                <h2 class="text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-2">文件資訊</h2>
                <div id="fileMeta" class="text-sm space-y-2">
                    <div class="text-slate-500 dark:text-slate-400 italic text-xs">尚未載入檔案</div>
                </div>
            </div>

            <div class="p-4 flex-1 overflow-y-auto">
                <h2 class="text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-2">文字統計</h2>
                <div class="grid grid-cols-2 gap-2 text-center text-sm mb-4">
                    <div class="bg-slate-50 dark:bg-slate-700/50 p-2.5 rounded-lg border border-slate-100 dark:border-slate-700">
                        <div class="text-xs text-slate-400 mb-0.5">總字數 (CJK/英)</div>
                        <div id="statWords" class="font-bold text-blue-600 dark:text-blue-400 text-base">0</div>
                    </div>
                    <div class="bg-slate-50 dark:bg-slate-700/50 p-2.5 rounded-lg border border-slate-100 dark:border-slate-700">
                        <div class="text-xs text-slate-400 mb-0.5">總字元數</div>
                        <div id="statChars" class="font-bold text-slate-700 dark:text-slate-300 text-base">0</div>
                    </div>
                </div>

                <h2 class="text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-2">語種偵測</h2>
                <div id="langBadges" class="flex flex-wrap gap-1.5">
                    <span class="text-xs px-2 py-1 bg-slate-100 dark:bg-slate-700 text-slate-500 rounded">待讀取</span>
                </div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col min-w-0 bg-slate-200/60 dark:bg-slate-950 overflow-hidden relative">
            
            <!-- Document Controls Bar -->
            <div id="controlBar" class="no-print bg-white/90 dark:bg-slate-800/90 backdrop-blur border-b border-slate-200 dark:border-slate-700 px-4 py-2 flex flex-wrap items-center justify-between gap-2 z-20 hidden">
                
                <!-- Search Box -->
                <div class="flex items-center gap-1.5 bg-slate-100 dark:bg-slate-700 px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-600 focus-within:ring-2 focus-within:ring-blue-500">
                    <i class="fa-solid fa-magnifying-glass text-slate-400 text-xs"></i>
                    <input type="text" id="searchInput" placeholder="搜尋內文 (中/日/英)..." class="bg-transparent text-sm focus:outline-none w-36 sm:w-48 text-slate-800 dark:text-slate-100">
                    <span id="searchCount" class="text-xs text-slate-400 min-w-[2rem] text-right">0/0</span>
                    <button id="btnPrevMatch" class="p-1 hover:text-blue-600 text-slate-400 text-xs" title="上一個"><i class="fa-solid fa-chevron-up"></i></button>
                    <button id="btnNextMatch" class="p-1 hover:text-blue-600 text-slate-400 text-xs" title="下一個"><i class="fa-solid fa-chevron-down"></i></button>
                </div>

                <!-- Zoom and Format Controls -->
                <div class="flex items-center gap-2 text-sm">
                    <div class="flex items-center bg-slate-100 dark:bg-slate-700 rounded-lg p-0.5 border border-slate-200 dark:border-slate-600">
                        <button id="btnZoomOut" class="p-1.5 px-2 hover:bg-white dark:hover:bg-slate-600 rounded text-slate-600 dark:text-slate-300 transition" title="縮小"><i class="fa-solid fa-minus text-xs"></i></button>
                        <span id="zoomLevel" class="px-2 text-xs font-semibold text-slate-600 dark:text-slate-300">100%</span>
                        <button id="btnZoomIn" class="p-1.5 px-2 hover:bg-white dark:hover:bg-slate-600 rounded text-slate-600 dark:text-slate-300 transition" title="放大"><i class="fa-solid fa-plus text-xs"></i></button>
                    </div>

                    <button id="btnCopy" class="p-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-lg transition" title="複製純文字">
                        <i class="fa-regular fa-copy"></i>
                    </button>

                    <button id="btnPrint" class="p-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-lg transition" title="列印 / 存為 PDF">
                        <i class="fa-solid fa-print"></i>
                    </button>
                </div>
            </div>

            <div id="scrollContainer" class="flex-1 overflow-y-auto p-4 md:p-8 flex justify-center items-start">
                
                <!-- Empty State / Dropzone -->
                <div id="dropzone" class="w-full max-w-xl my-auto border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-2xl p-8 md:p-12 text-center bg-white/50 dark:bg-slate-800/50 backdrop-blur hover:border-blue-500 transition duration-200 cursor-pointer">
                    <div class="w-16 h-16 bg-blue-50 dark:bg-slate-700 text-blue-600 dark:text-blue-400 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                    </div>
                    <h3 class="font-bold text-lg mb-2">拖放 .docx 或 .doc 檔案至此</h3>
                    <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">支援繁簡體中文、日文、英文格式文件</p>
                    
                    <button class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg font-medium text-sm transition shadow-sm inline-flex items-center gap-2">
                        <i class="fa-solid fa-file-circle-plus"></i> 選擇電腦檔案
                    </button>
                    
                    <div class="mt-6 pt-6 border-t border-slate-200 dark:border-slate-700/60 flex items-center justify-center gap-4 text-xs text-slate-400">
                        <span><i class="fa-solid fa-check text-green-500 mr-1"></i>.docx 完整樣式</span>
                        <span><i class="fa-solid fa-check text-green-500 mr-1"></i>.doc 純文字提取</span>
                    </div>
                </div>

                <!-- Paper Sheet Render Container -->
                <div id="paperSheet" class="print-area bg-white dark:bg-slate-800 shadow-xl rounded-sm p-8 md:p-16 w-full max-w-4xl min-h-[80vh] transition-transform duration-150 origin-top hidden">
                    <div id="docViewer" class="doc-content"></div>
                </div>

                <!-- Loading Overlay -->
                <div id="loadingOverlay" class="absolute inset-0 bg-white/80 dark:bg-slate-900/80 backdrop-blur flex flex-col items-center justify-center gap-3 z-30 hidden">
                    <div class="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                    <p id="loadingText" class="text-sm font-medium text-slate-700 dark:text-slate-300">解析文件中...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="no-print fixed bottom-5 right-5 bg-slate-800 text-white text-sm px-4 py-2.5 rounded-lg shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none z-50 flex items-center gap-2">
        <i id="toastIcon" class="fa-solid fa-circle-info text-blue-400"></i>
        <span id="toastMsg">訊息內容</span>
    </div>

    <script>
        // Global State Variables
        let currentZoom = 100;
        let originalText = '';
        let searchMatches = [];
        let currentMatchIdx = -1;

        // DOM Elements
        const fileInput = document.getElementById('fileInput');
        const dropzone = document.getElementById('dropzone');
        const paperSheet = document.getElementById('paperSheet');
        const docViewer = document.getElementById('docViewer');
        const controlBar = document.getElementById('controlBar');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');
        
        const statWords = document.getElementById('statWords');
        const statChars = document.getElementById('statChars');
        const langBadges = document.getElementById('langBadges');
        const fileMeta = document.getElementById('fileMeta');

        window.onload = function() {
            // Theme toggle listener
            document.getElementById('btnThemeToggle').addEventListener('click', toggleTheme);
            
            // Drag and drop setup
            dropzone.addEventListener('click', () => fileInput.click());
            dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('border-blue-500'); });
            dropzone.addEventListener('dragleave', () => dropzone.classList.remove('border-blue-500'));
            dropzone.addEventListener('drop', handleFileDrop);

            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) processFile(e.target.files[0]);
            });

            // Sample document button
            document.getElementById('btnSample').addEventListener('click', loadSampleDocument);

            // Controls setup
            document.getElementById('btnZoomIn').addEventListener('click', () => adjustZoom(10));
            document.getElementById('btnZoomOut').addEventListener('click', () => adjustZoom(-10));
            document.getElementById('btnCopy').addEventListener('click', copyTextToClipboard);
            document.getElementById('btnPrint').addEventListener('click', () => window.print());

            // Search setup
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', handleSearch);
            document.getElementById('btnNextMatch').addEventListener('click', () => navigateSearch(1));
            document.getElementById('btnPrevMatch').addEventListener('click', () => navigateSearch(-1));
        };

        function handleFileDrop(e) {
            e.preventDefault();
            dropzone.classList.remove('border-blue-500');
            if (e.dataTransfer.files.length > 0) {
                processFile(e.dataTransfer.files[0]);
            }
        }

        function processFile(file) {
            const fileName = file.name;
            const ext = fileName.split('.').pop().toLowerCase();

            if (ext !== 'docx' && ext !== 'doc') {
                showToast('請上傳 .doc 或 .docx 格式的文件', 'error');
                return;
            }

            showLoading(`正在處理 ${fileName}...`);

            // Update Metadata sidebar
            fileMeta.innerHTML = `
                <div class="font-medium text-slate-800 dark:text-slate-200 truncate" title="${fileName}">${fileName}</div>
                <div class="text-slate-400 text-xs">${(file.size / 1024).toFixed(1)} KB | .${ext.toUpperCase()}</div>
            `;

            const reader = new FileReader();

            if (ext === 'docx') {
                reader.onload = function(e) {
                    const arrayBuffer = e.target.result;
                    mammoth.convertToHtml({ arrayBuffer: arrayBuffer })
                        .then(displayDocxResult)
                        .catch(err => {
                            showToast('DOCX 解析失敗: ' + err.message, 'error');
                            hideLoading();
                        });
                };
                reader.readAsArrayBuffer(file);
            } else if (ext === 'doc') {
                reader.onload = function(e) {
                    const arrayBuffer = e.target.result;
                    parseLegacyDoc(arrayBuffer, fileName);
                };
                reader.readAsArrayBuffer(file);
            }
        }

        function displayDocxResult(result) {
            const html = result.value; // The generated HTML
            docViewer.innerHTML = html || '<p class="text-slate-400 italic">此文件內無文字內容</p>';
            
            showDocContainer();
            analyzeTextContent();
            hideLoading();
            showToast('DOCX 文件載入成功！', 'success');
        }

        function parseLegacyDoc(arrayBuffer, fileName) {
            try {
                // Legacy .doc is an OLE compound binary.
                // Extract printable UTF-16LE / ASCII text stream blocks
                const bytes = new Uint8Array(arrayBuffer);
                let extractedText = '';
                let tempStr = '';

                // Scanning byte sequences for CJK and ASCII characters
                for (let i = 0; i < bytes.length - 1; i += 2) {
                    const charCode = bytes[i] | (bytes[i + 1] << 8);
                    
                    // Chinese/Japanese/Korean and Latin printable Unicode ranges
                    if (
                        (charCode >= 0x0020 && charCode <= 0x007E) || // Basic Latin
                        (charCode >= 0x4E00 && charCode <= 0x9FFF) || // CJK Unified Ideographs
                        (charCode >= 0x3040 && charCode <= 0x309F) || // Hiragana
                        (charCode >= 0x30A0 && charCode <= 0x30FF) || // Katakana
                        (charCode >= 0xFF00 && charCode <= 0xFFEF) || // Fullwidth forms
                        charCode === 10 || charCode === 13             // Newlines
                    ) {
                        tempStr += String.fromCharCode(charCode);
                    } else {
                        if (tempStr.trim().length > 3) {
                            extractedText += tempStr + '\n\n';
                        }
                        tempStr = '';
                    }
                }

                // Format text into structured paragraphs
                const paragraphs = extractedText.split(/\n+/)
                    .map(p => p.trim())
                    .filter(p => p.length > 2)
                    .map(p => `<p class="mb-4">${escapeHtml(p)}</p>`)
                    .join('');

                docViewer.innerHTML = `
                    <div class="bg-amber-50 dark:bg-amber-950/40 border-l-4 border-amber-500 p-3 mb-6 text-xs text-amber-800 dark:text-amber-300 rounded">
                        <i class="fa-solid fa-triangle-exclamation mr-1"></i>
                        注意：此檔為舊版 <strong>.DOC</strong> 格式，已為您提純提取中/日/英文字內容。
                    </div>
                    ${paragraphs || '<p>未能從此 .doc 檔案中擷取出可讀文字。</p>'}
                `;

                showDocContainer();
                analyzeTextContent();
                hideLoading();
                showToast('.DOC 文字提取成功！', 'success');
            } catch (err) {
                showToast('解析 .DOC 檔案失敗', 'error');
                hideLoading();
            }
        }

        function analyzeTextContent() {
            originalText = docViewer.innerText || '';
            const text = originalText;

            // Character count
            const charCount = text.length;
            statChars.innerText = charCount.toLocaleString();

            // Word / Character statistics (CJK aware)
            const cjkMatch = text.match(/[\u4e00-\u9fa5\u3040-\u30ff\u3400-\u4dbf]/g) || [];
            const englishWords = text.replace(/[\u4e00-\u9fa5\u3040-\u30ff\u3400-\u4dbf]/g, ' ')
                                     .trim().split(/\s+/).filter(w => w.length > 0);
            
            const totalWords = cjkMatch.length + englishWords.length;
            statWords.innerText = totalWords.toLocaleString();

            // Language Detection Badges
            langBadges.innerHTML = '';
            const hasTC = /[\u4e00-\u9fa5]/.test(text);
            const hasJP = /[\u3040-\u30ff]/.test(text);
            const hasEN = /[a-zA-Z]/.test(text);

            if (hasTC) langBadges.innerHTML += `<span class="text-xs px-2 py-0.5 bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200 rounded font-medium">中文</span>`;
            if (hasJP) langBadges.innerHTML += `<span class="text-xs px-2 py-0.5 bg-red-100 text-red-800 dark:bg-red-900 dark:text-red-200 rounded font-medium">日文</span>`;
            if (hasEN) langBadges.innerHTML += `<span class="text-xs px-2 py-0.5 bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200 rounded font-medium">英文</span>`;
            
            if (!hasTC && !hasJP && !hasEN) {
                langBadges.innerHTML = `<span class="text-xs px-2 py-1 bg-slate-100 dark:bg-slate-700 text-slate-500 rounded">未知語種</span>`;
            }
        }

        function handleSearch(e) {
            const query = e.target.value.trim();
            if (!query) {
                resetHighlights();
                document.getElementById('searchCount').innerText = '0/0';
                return;
            }

            // Simple DOM text highlighting
            resetHighlights();
            searchMatches = [];
            
            const walker = document.createTreeWalker(docViewer, NodeFilter.SHOW_TEXT, null, false);
            let node;
            const nodesToReplace = [];

            while (node = walker.nextNode()) {
                const idx = node.nodeValue.toLowerCase().indexOf(query.toLowerCase());
                if (idx !== -1 && node.parentNode.tagName !== 'MARK') {
                    nodesToReplace.push(node);
                }
            }

            nodesToReplace.forEach(textNode => {
                const val = textNode.nodeValue;
                const regex = new RegExp(`(${escapeRegExp(query)})`, 'gi');
                const span = document.createElement('span');
                span.innerHTML = val.replace(regex, '<mark class="highlight">$1</mark>');
                textNode.parentNode.replaceChild(span, textNode);
            });

            searchMatches = Array.from(docViewer.querySelectorAll('mark.highlight'));
            currentMatchIdx = searchMatches.length > 0 ? 0 : -1;
            updateSearchUI();
        }

        function navigateSearch(dir) {
            if (searchMatches.length === 0) return;
            currentMatchIdx = (currentMatchIdx + dir + searchMatches.length) % searchMatches.length;
            updateSearchUI();
        }

        function updateSearchUI() {
            const countSpan = document.getElementById('searchCount');
            if (searchMatches.length === 0) {
                countSpan.innerText = '0/0';
                return;
            }
            countSpan.innerText = `${currentMatchIdx + 1}/${searchMatches.length}`;
            
            searchMatches.forEach((m, i) => {
                m.classList.toggle('bg-orange-400', i === currentMatchIdx);
                m.classList.toggle('bg-yellow-200', i !== currentMatchIdx);
            });

            searchMatches[currentMatchIdx].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function resetHighlights() {
            const marks = docViewer.querySelectorAll('mark.highlight');
            marks.forEach(m => {
                const text = document.createTextNode(m.innerText);
                m.parentNode.replaceChild(text, m);
            });
        }

        function loadSampleDocument() {
            showLoading('載入範例文件中...');
            setTimeout(() => {
                docViewer.innerHTML = `
                    <h1 style="text-align: center;">Doc / Docx 多語言測試文件</h1>
                    <p style="text-align: center; color: #6b7280; font-size: 0.9em;">本範例展示中文、日文及英文的渲染排版效果</p>
                    <hr style="margin: 2em 0; border: 0; border-top: 1px solid #e5e7eb;" />

                    <h2>一、繁體中文 (Traditional Chinese)</h2>
                    <p>歡迎使用全新的線上文件閱讀器。本工具特別針對亞洲文字（繁體中文、簡體中文、日文平假名及片假名）進行了字體與排版優化，確保閱讀時文字清晰、行距舒適。</p>
                    <ul>
                        <li>支援標準Word <code>.docx</code> 富文字樣式與表格排版。</li>
                        <li>支援傳統 <code>.doc</code> 二進位檔案的文字提取。</li>
                        <li>提供內文搜尋、即時字數統計與直覺的縮放控制。</li>
                    </ul>

                    <h2>二、日本語 (Japanese)</h2>

        function adjustZoom(delta) {
            currentZoom = Math.min(Math.max(currentZoom + delta, 50), 200);
            paperSheet.style.transform = `scale(${currentZoom / 100})`;
            document.getElementById('zoomLevel').innerText = `${currentZoom}%`;
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            document.getElementById('themeIcon').className = isDark ? 'fa-solid fa-sun text-yellow-400' : 'fa-solid fa-moon';
        }

        function copyTextToClipboard() {
            if (!originalText) return;
            const textarea = document.createElement('textarea');
            textarea.value = originalText;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showToast('已複製內文至剪貼簿！', 'success');
        }

        function showDocContainer() {
            dropzone.classList.add('hidden');
            paperSheet.classList.remove('hidden');
            controlBar.classList.remove('hidden');
        }

        function showLoading(msg) {
            loadingText.innerText = msg;
            loadingOverlay.classList.remove('hidden');
        }

        function hideLoading() {
            loadingOverlay.classList.add('hidden');
        }

        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.innerText = msg;
            if (type === 'error') toastIcon.className = 'fa-solid fa-circle-exclamation text-red-400';
            else if (type === 'success') toastIcon.className = 'fa-solid fa-circle-check text-green-400';
            else toastIcon.className = 'fa-solid fa-circle-info text-blue-400';

            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 3000);
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }
    </script>
