
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word 文件閱讀器 5.2</title>

<!-- DOCX 排版引擎 -->
<script src="https://cdn.jsdelivr.net/npm/docx-preview@0.3.6/dist/docx-preview.min.js"></script>

<!-- 舊版 DOC 本機解析器：無 TOKEN、無上傳 -->
<script src="https://cdn.jsdelivr.net/gh/Alpaq92/JSDoc@main/src/docToText.js"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#f1f5f9;
 color:#1e293b;
 font-family:Arial,"Microsoft JhengHei",sans-serif;
}

header{
 background:white;
 padding:16px 22px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 border-bottom:1px solid #ddd;
}

h1{font-size:19px;margin:0}

button,.upload{
 border:0;
 border-radius:8px;
 padding:11px 16px;
 background:#2563eb;
 color:white;
 cursor:pointer;
 font-size:14px;
 display:inline-block;
}

button:hover,.upload:hover{background:#1d4ed8}
button:disabled{opacity:.5;cursor:not-allowed}

.toolbar{
 background:white;
 padding:12px;
 display:flex;
 gap:9px;
 align-items:center;
 flex-wrap:wrap;
 justify-content:center;
}

.toolbar input{
 padding:10px;
 border:1px solid #ddd;
 border-radius:7px;
 min-width:160px;
}

#fileInput{display:none}

main{
 padding:20px;
 max-width:1200px;
 margin:auto;
}

#dropzone{
 background:white;
 border:2px dashed #94a3b8;
 border-radius:15px;
 padding:55px 20px;
 text-align:center;
 cursor:pointer;
}

#dropzone.drag{
 border-color:#2563eb;
 background:#eff6ff;
}

#loading{
 display:none;
 text-align:center;
 padding:20px;
}

#message{
 padding:12px;
 text-align:center;
 color:#475569;
}

#meta{
 text-align:center;
 color:#64748b;
 font-size:13px;
 margin:12px;
}

#paper{
 display:none;
 background:#cbd5e1;
 padding:25px 10px;
 min-height:70vh;
 overflow:auto;
}

#viewer{
 width:100%;
 margin:auto;
}

/* DOCX 頁面 */

#viewer .docx-wrapper{
 background:transparent;
 padding:0;
}

#viewer .docx{
 margin:0 auto 20px;
 box-shadow:0 3px 15px #0002;
}

/* 舊 DOC 格式化文件 */

.doc-html{
 background:white;
 color:#222;
 padding:40px;
 min-height:70vh;
 max-width:1000px;
 margin:auto;
 overflow-x:auto;
 line-height:1.7;
 overflow-wrap:anywhere;
}

/* 舊 DOC 表格：保留原有結構及基本邊框 */

.doc-html table{
 border-collapse:collapse;
 border-spacing:0;
 max-width:100%;
 margin:12px 0;
}

.doc-html td,
.doc-html th{
 border:1px solid #999;
 padding:5px 8px;
 vertical-align:top;
 min-width:25px;
}

.doc-html tr{
 page-break-inside:avoid;
}

.doc-html p{
 margin-top:0;
 margin-bottom:6px;
}

.doc-html img{
 max-width:100%;
 height:auto;
}

.doc-html table img{
 max-width:100%;
}

/* 搜尋結果 */

mark{
 background:#fde047 !important;
 color:#111 !important;
 outline:none;
}

mark.active{
 outline:2px solid #f97316;
}

/* 深色模式 */

.dark{
 background:#0f172a;
 color:#f1f5f9;
}

.dark header,
.dark .toolbar,
.dark #dropzone{
 background:#1e293b;
 color:#f1f5f9;
}

.dark #dropzone{border-color:#475569}
.dark #paper{background:#334155}

.dark .doc-html{
 background:#1e293b;
 color:#f1f5f9;
}

.dark .doc-html td,
.dark .doc-html th{
 border-color:#64748b;
}

.dark .toolbar input{
 background:#334155;
 color:white;
 border-color:#475569;
}

.dark #message,
.dark #meta{
 color:#cbd5e1;
}

.dark mark{
 background:#facc15 !important;
 color:#111 !important;
}

@media(max-width:600px){
 header{padding:12px}
 h1{font-size:16px}
 main{padding:10px}
 #paper{padding:10px 3px}
 .toolbar{gap:6px}
 .toolbar input{min-width:130px}
 .doc-html{padding:15px}
}
</style>
</head>

<body>

<header>
 <div>
  <h1>📄 Word 文件閱讀器 5.2</h1>
  <small>DOC / DOCX · 表格排版閱讀</small>
 </div>
 <button id="themeBtn">🌙</button>
</header>

<div class="toolbar" id="toolbar" style="display:none">
 <input type="search" id="search" placeholder="搜尋文件文字">
 <button id="prev">↑</button>
 <button id="next">↓</button>
 <span id="count">0/0</span>
 <button id="smaller">－</button>
 <span id="zoom">100%</span>
 <button id="bigger">＋</button>
 <button id="copy">📋 複製全文</button>
 <button id="clear">關閉文件</button>
</div>

<main>

<input type="file" id="fileInput" accept=".doc,.docx">

<div id="dropzone">
 <div style="font-size:50px">📂</div>
 <h2>開啟 Word 文件</h2>
 <p>選擇 DOC 或 DOCX 文件，或直接拖放到這裡。</p>

 <label for="fileInput" class="upload">
 選擇電腦檔案
 </label>

 <p style="font-size:12px;color:#94a3b8;margin-top:20px">
 DOCX：保留大部分 Word 排版<br>
 DOC：支援表格及基本格式還原<br>
 文件只在瀏覽器本機處理，不會上傳
 </p>
</div>

<div id="loading">⏳ 正在讀取文件...</div>
<div id="message">等待載入文件</div>
<div id="meta"></div>

<article id="paper">
 <div id="viewer"></div>
</article>

</main>

<script>
'use strict';

const $=id=>document.getElementById(id);

const input=$('fileInput');
const drop=$('dropzone');
const viewer=$('viewer');

let fullText='';
let zoom=100;
let matches=[];
let current=-1;
let busy=false;
let plainMode=false;

/* 基本訊息 */

function message(text){
 $('message').textContent=text;
}

function resetSearch(){
 matches=[];
 current=-1;
 $('count').textContent='0/0';
}

/* 移除搜尋標記 */

function removeMarks(){

 viewer.querySelectorAll('mark').forEach(m=>{
  m.replaceWith(document.createTextNode(m.textContent));
 });

 viewer.normalize();
 resetSearch();
}

/* 取得全文 */

function getText(){
 return viewer.innerText || viewer.textContent || '';
}

/* 放大縮小 */

function updateZoom(){

 viewer.style.zoom=zoom/100;

 $('zoom').textContent=zoom+'%';
}

$('bigger').onclick=()=>{
 zoom=Math.min(180,zoom+10);
 updateZoom();
};

$('smaller').onclick=()=>{
 zoom=Math.max(60,zoom-10);
 updateZoom();
};

/* 從 JSDoc HTML 結果取得正文 */

function getDocHtml(result){

 if(typeof result==='string'){
  return result;
 }

 if(!result || typeof result!=='object'){
  return '';
 }

 if(typeof result.body==='string'){
  return result.body;
 }

 if(typeof result.html==='string'){
  return result.html;
 }

 if(typeof result.body?.html==='string'){
  return result.body.html;
 }

 if(typeof result.document==='string'){
  return result.document;
 }

 return '';
}

/* 載入檔案 */

input.addEventListener('change',()=>{
 const file=input.files[0];
 if(file)openFile(file);
});

async function openFile(file){

 if(busy)return;

 const ext=file.name.split('.').pop().toLowerCase();

 if(!['doc','docx'].includes(ext)){
  alert('只支援 DOC 和 DOCX 文件');
  input.value='';
  return;
 }

 if(file.size===0 || file.size>30*1024*1024){
  alert('文件大小不正確，或超過30MB');
  input.value='';
  return;
 }

 busy=true;

 $('loading').style.display='block';
 $('paper').style.display='none';
 $('toolbar').style.display='none';

 viewer.innerHTML='';
 viewer.style.zoom='1';

 fullText='';
 plainMode=false;

 resetSearch();

 message('正在讀取 '+file.name+'...');

 try{

  const buffer=await file.arrayBuffer();

  /* =========================
     DOCX 新版 Word
  ========================= */

  if(ext==='docx'){

   message('正在還原 DOCX Word 排版...');

   if(!window.docx || !docx.renderAsync){
    throw new Error('DOCX 排版引擎未能載入，請檢查網絡。');
   }

   plainMode=false;

   await docx.renderAsync(
    buffer,
    viewer,
    viewer,
    {
     className:'docx',
     inWrapper:true,
     ignoreWidth:false,
     ignoreHeight:false,
     ignoreFonts:false,
     breakPages:true,
     ignoreLastRenderedPageBreak:false,
     experimental:false,
     trimXmlDeclaration:true,
     useBase64URL:true,
     renderChanges:false,
     renderHeaders:true,
     renderFooters:true,
     renderFootnotes:true,
     renderEndnotes:true
    }
   );

   fullText=getText();

  }

  /* =========================
     DOC 舊版 Word
     使用 JSDoc HTML 格式化輸出
  ========================= */

  else{

   message('正在解析舊版 DOC 及表格...');

   if(typeof docToText!=='function'){
    throw new Error('DOC 解析器未能載入，請檢查網絡。');
   }

   if(typeof docToText.html!=='function'){
    throw new Error('目前 DOC 解析器版本不支援 HTML 格式輸出。');
   }

   let result=docToText.html(buffer);

   if(result && typeof result.then==='function'){
    result=await result;
   }

   const html=getDocHtml(result);

   if(!html){
    throw new Error(
     '無法解析此 DOC 文件，可能是加密、損壞或不支援的舊格式。'
    );
   }

   plainMode=false;

   const container=document.createElement('div');
   container.className='doc-html';
   container.innerHTML=html;

   viewer.innerHTML='';
   viewer.appendChild(container);

   /* 如果 HTML 有表格，確保表格可見 */

   const tables=container.querySelectorAll('table');

   tables.forEach(table=>{
    table.style.maxWidth='100%';
   });

   fullText=getText();

   if(!fullText.trim() && !tables.length){
    throw new Error('DOC 文件沒有可讀取的內容。');
   }

   if(tables.length){
    message('DOC 載入成功 · 找到 '+tables.length+' 個表格');
   }

  }

  if(!fullText.trim() && !viewer.querySelector('table')){
   throw new Error('文件沒有可讀取的文字內容。');
  }

  $('meta').textContent=
   file.name+' | '+
   (file.size/1024).toFixed(1)+' KB | '+
   ext.toUpperCase();

  $('search').value='';

  zoom=100;
  viewer.style.zoom='1';
  $('zoom').textContent='100%';

  drop.style.display='none';
  $('paper').style.display='block';
  $('toolbar').style.display='flex';

  if(ext==='docx'){
   message('DOCX 文件載入成功');
  }else if(!viewer.querySelector('table')){
   message('DOC 文件載入成功');
  }

 }catch(err){

  console.error(err);

  viewer.innerHTML='';
  fullText='';

  message('讀取失敗：'+err.message);

  alert('文件讀取失敗：\n\n'+err.message);

 }finally{

  $('loading').style.display='none';
  input.value='';
  busy=false;
 }
}

/* =========================
   搜尋文件文字
========================= */

$('search').addEventListener('input',()=>{

 removeMarks();

 const q=$('search').value.trim();

 if(!q)return;

 const escaped=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
 const re=new RegExp(escaped,'gi');

 const walker=document.createTreeWalker(
  viewer,
  NodeFilter.SHOW_TEXT,
  {
   acceptNode(node){

    if(!node.nodeValue.trim()){
     return NodeFilter.FILTER_REJECT;
    }

    if(node.parentElement.closest('mark,script,style')){
     return NodeFilter.FILTER_REJECT;
    }

    return NodeFilter.FILTER_ACCEPT;
   }
  }
 );

 const nodes=[];
 let node;

 while((node=walker.nextNode())){
  nodes.push(node);
 }

 nodes.forEach(n=>{

  const val=n.nodeValue;

  re.lastIndex=0;

  if(!re.test(val))return;

  re.lastIndex=0;

  const frag=document.createDocumentFragment();

  let last=0;
  let m;

  while((m=re.exec(val))!==null){

   frag.appendChild(
    document.createTextNode(val.slice(last,m.index))
   );

   const mark=document.createElement('mark');
   mark.textContent=m[0];

   frag.appendChild(mark);

   last=re.lastIndex;
  }

  frag.appendChild(
   document.createTextNode(val.slice(last))
  );

  n.replaceWith(frag);
 });

 matches=Array.from(viewer.querySelectorAll('mark'));

 current=matches.length?0:-1;

 updateSearch();
});

function updateSearch(){

 $('count').textContent=matches.length?
  (current+1)+'/'+matches.length:'0/0';

 matches.forEach((m,i)=>{
  m.classList.toggle('active',i===current);
 });

 if(current>=0){
  matches[current].scrollIntoView({
   behavior:'smooth',
   block:'center'
  });
 }
}

function moveSearch(dir){

 if(!matches.length)return;

 current=(current+dir+matches.length)%matches.length;

 updateSearch();
}

$('next').onclick=()=>moveSearch(1);
$('prev').onclick=()=>moveSearch(-1);

/* =========================
   複製全文
========================= */

$('copy').onclick=async()=>{

 try{

  const text=getText();

  if(navigator.clipboard && window.isSecureContext){
   await navigator.clipboard.writeText(text);
  }else{

   const t=document.createElement('textarea');
   t.value=text;

   document.body.appendChild(t);
   t.select();

   if(!document.execCommand('copy')){
    throw new Error('Copy failed');
   }

   t.remove();
  }

  alert('全文已複製');

 }catch(e){
  alert('複製失敗，請手動選取文字');
 }
};

/* =========================
   關閉文件
========================= */

$('clear').onclick=()=>{

 viewer.innerHTML='';
 viewer.style.zoom='1';

 $('paper').style.display='none';
 $('toolbar').style.display='none';

 drop.style.display='block';

 $('meta').textContent='';
 $('search').value='';

 fullText='';
 plainMode=false;
 zoom=100;

 resetSearch();

 message('等待載入文件');
};

/* =========================
   深色模式
========================= */

$('themeBtn').onclick=()=>{

 document.body.classList.toggle('dark');

 $('themeBtn').textContent=
  document.body.classList.contains('dark')?
  '☀️':'🌙';
};

/* =========================
   拖放文件
========================= */

drop.addEventListener('dragover',e=>{
 e.preventDefault();
 drop.classList.add('drag');
});

drop.addEventListener('dragleave',()=>{
 drop.classList.remove('drag');
});

drop.addEventListener('drop',e=>{

 e.preventDefault();

 drop.classList.remove('drag');

 const file=e.dataTransfer.files[0];

 if(file)openFile(file);
});

document.addEventListener('dragover',e=>{
 e.preventDefault();
});

document.addEventListener('drop',e=>{

 if(e.target!==drop && !drop.contains(e.target)){
  e.preventDefault();
 }
});

</script>
</body>
</html>
