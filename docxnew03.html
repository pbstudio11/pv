
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word 文件閱讀器 5.3</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docx-preview@0.3.6/dist/docx-preview.min.css">
<script src="https://cdn.jsdelivr.net/npm/docx-preview@0.3.6/dist/docx-preview.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/Alpaq92/JSDoc@main/src/docToText.js"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#f1f5f9;
 color:#1e293b;
 font-family:Arial,"Microsoft JhengHei",sans-serif;
}

header{
 background:white;
 padding:16px 22px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 border-bottom:1px solid #ddd;
 gap:10px;
}

h1{font-size:19px;margin:0}

button,.upload{
 border:0;
 border-radius:8px;
 padding:11px 16px;
 background:#2563eb;
 color:white;
 cursor:pointer;
 font-size:14px;
 display:inline-block;
}

button:hover,.upload:hover{background:#1d4ed8}
button:disabled{opacity:.5;cursor:not-allowed}

.toolbar{
 background:white;
 padding:12px;
 display:flex;
 gap:9px;
 align-items:center;
 flex-wrap:wrap;
 justify-content:center;
}

.toolbar input{
 padding:10px;
 border:1px solid #ddd;
 border-radius:7px;
 min-width:160px;
}

#fileInput{display:none}

main{
 padding:20px;
 max-width:1200px;
 margin:auto;
}

#dropzone{
 background:white;
 border:2px dashed #94a3b8;
 border-radius:15px;
 padding:55px 20px;
 text-align:center;
 cursor:pointer;
}

#dropzone.drag{
 border-color:#2563eb;
 background:#eff6ff;
}

#loading{
 display:none;
 text-align:center;
 padding:20px;
 font-weight:bold;
}

#message{
 padding:12px;
 text-align:center;
 color:#475569;
}

#meta{
 text-align:center;
 color:#64748b;
 font-size:13px;
 margin:12px;
}

#paper{
 display:none;
 background:#cbd5e1;
 padding:25px 10px;
 min-height:70vh;
 overflow:auto;
}

#viewer{
 width:100%;
 margin:auto;
 min-width:0;
}

#viewer .docx-wrapper{
 background:transparent;
 padding:0;
}

#viewer .docx{
 margin:0 auto 20px;
 box-shadow:0 3px 15px #0002;
 max-width:100%;
}

/* TABLE 支援 */

#viewer .docx table{
 border-collapse:collapse;
 max-width:100%;
}

#viewer .docx td,
#viewer .docx th{
 vertical-align:top;
 overflow-wrap:anywhere;
}

#viewer .docx table p{
 margin-top:0;
 margin-bottom:0;
}

/* 搜尋 */

mark{
 background:#fde047 !important;
 color:#111 !important;
 outline:none;
}

mark.active{
 outline:2px solid #f97316;
}

/* 舊 DOC 備用文字模式 */

.plain-document{
 background:white;
 padding:45px;
 min-height:70vh;
 max-width:900px;
 margin:auto;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
 font-size:16px;
 line-height:1.9;
}

/* 深色模式 */

.dark{
 background:#0f172a;
 color:#f1f5f9;
}

.dark header,.dark .toolbar,
.dark #dropzone{
 background:#1e293b;
 color:#f1f5f9;
}

.dark #dropzone{border-color:#475569}
.dark #paper{background:#334155}

.dark .plain-document{
 background:#1e293b;
 color:#f1f5f9;
}

.dark .toolbar input{
 background:#334155;
 color:white;
 border-color:#475569;
}

.dark #message,.dark #meta{
 color:#cbd5e1;
}

.dark mark{
 background:#facc15 !important;
 color:#111 !important;
}

@media(max-width:600px){
 header{padding:12px}
 h1{font-size:16px}
 main{padding:10px}
 #paper{padding:10px 3px}
 .toolbar{gap:6px}
 .toolbar input{min-width:130px}
}
</style>
</head>

<body>

<header>
 <div>
  <h1>📄 Word 文件閱讀器 5.3</h1>
  <small>DOC / DOCX · 舊版 DOC 雲端轉換 · TABLE 支援</small>
 </div>

 <div style="display:flex;gap:6px">
  <button id="keyBtn" title="設定 ConvertAPI Key">🔑 API</button>
  <button id="themeBtn">🌙</button>
 </div>
</header>

<div class="toolbar" id="toolbar" style="display:none">
 <input type="search" id="search" placeholder="搜尋文件文字">
 <button id="prev">↑</button>
 <button id="next">↓</button>
 <span id="count">0/0</span>
 <button id="smaller">－</button>
 <span id="zoom">100%</span>
 <button id="bigger">＋</button>
 <button id="copy">📋 複製全文</button>
 <button id="clear">關閉文件</button>
</div>

<main>

<input type="file" id="fileInput" accept=".doc,.docx">

<div id="dropzone">
 <div style="font-size:50px">📂</div>
 <h2>開啟 Word 文件</h2>
 <p>選擇 DOC 或 DOCX 文件，或直接拖放到這裡。</p>

 <label for="fileInput" class="upload">
 選擇電腦檔案
 </label>

 <p style="font-size:12px;color:#94a3b8;margin-top:20px">
 DOCX：直接讀取 Word 排版<br>
 DOC：自動上傳轉換成 DOCX 再顯示<br>
 TABLE：支援表格、儲存格及框線還原<br>
 文件轉換由 ConvertAPI 處理
 </p>
</div>

<div id="loading">⏳ 正在讀取文件...</div>
<div id="message">等待載入文件</div>
<div id="meta"></div>

<article id="paper">
 <div id="viewer"></div>
</article>

</main>

<script>
'use strict';

const $=id=>document.getElementById(id);

const input=$('fileInput');
const drop=$('dropzone');
const viewer=$('viewer');

const API_URL='https://v2.convertapi.com/convert/doc/to/docx';
const KEY_NAME='word_reader_convertapi_token';

let fullText='';
let zoom=100;
let matches=[];
let current=-1;
let busy=false;
let plainMode=false;

/* API KEY 管理 */

function getApiKey(){
 return localStorage.getItem(KEY_NAME)||'';
}

function setApiKey(){

 const oldKey=getApiKey();

 const key=prompt(
  '請輸入 ConvertAPI API Token：\n\n' +
  '輸入後會儲存在此瀏覽器，方便下次使用。\n' +
  '留空或取消不會更改原有設定。',
  oldKey
 );

 if(key===null)return;

 if(!key.trim()){
  if(confirm('是否刪除已儲存的 API Token？')){
   localStorage.removeItem(KEY_NAME);
   alert('API Token 已刪除');
  }
  return;
 }

 localStorage.setItem(KEY_NAME,key.trim());

 alert('API Token 已儲存！');
}

$('keyBtn').onclick=setApiKey;

/* 提示訊息 */

function message(text){
 $('message').textContent=text;
}

function resetSearch(){
 matches=[];
 current=-1;
 $('count').textContent='0/0';
}

function removeMarks(){

 viewer.querySelectorAll('mark').forEach(m=>{
  m.replaceWith(document.createTextNode(m.textContent));
 });

 viewer.normalize();
 resetSearch();
}

function getText(){
 return viewer.innerText || viewer.textContent || '';
}

/* 縮放 */

function updateZoom(){

 if(plainMode){
  const doc=viewer.querySelector('.plain-document');
  if(doc)doc.style.fontSize=(16*zoom/100)+'px';
 }else{
  viewer.style.zoom=zoom/100;
 }

 $('zoom').textContent=zoom+'%';
}

$('bigger').onclick=()=>{
 zoom=Math.min(180,zoom+10);
 updateZoom();
};

$('smaller').onclick=()=>{
 zoom=Math.max(60,zoom-10);
 updateZoom();
};

/* DOC 舊版轉 DOCX */

async function convertDOC(file){

 const token=getApiKey();

 if(!token){
  throw new Error(
   '尚未設定 ConvertAPI Token。\n\n' +
   '請先按右上角 🔑 API 設定。'
  );
 }

 message('正在上傳舊版 DOC 到轉換服務...');

 const form=new FormData();

 form.append('File',file,file.name);
 form.append('StoreFile','false');

 let response;

 try{

  response=await fetch(API_URL,{
   method:'POST',
   headers:{
    'Authorization':'Bearer '+token
   },
   body:form
  });

 }catch(err){

  throw new Error(
   '無法連接 ConvertAPI。\n' +
   '請檢查網絡或服務是否可用。\n\n'+
   err.message
  );
 }

 if(!response.ok){

  let detail='';

  try{
   detail=await response.text();
  }catch(e){}

  if(response.status===401){
   throw new Error('API Token 無效，請重新設定。');
  }

  if(response.status===402){
   throw new Error('轉換額度不足或需要升級服務。');
  }

  if(response.status===429){
   throw new Error('轉換次數過多，請稍後再試。');
  }

  throw new Error(
   'DOC 轉換失敗：HTTP '+response.status+
   '\n'+detail.slice(0,500)
  );
 }

 const contentType=response.headers.get('content-type')||'';

 if(contentType.includes('json')){

  const data=await response.json();

  if(data.Files && data.Files[0] && data.Files[0].FileData){

   const binary=atob(data.Files[0].FileData);
   const bytes=new Uint8Array(binary.length);

   for(let i=0;i<binary.length;i++){
    bytes[i]=binary.charCodeAt(i);
   }

   return bytes.buffer;
  }

  throw new Error(
   '轉換服務沒有傳回 DOCX 檔案。'
  );
 }

 const blob=await response.blob();

 if(!blob.size){
  throw new Error('轉換結果是空白檔案。');
 }

 return await blob.arrayBuffer();
}

/* 開啟 DOC / DOCX */

input.addEventListener('change',()=>{
 const file=input.files[0];
 if(file)openFile(file);
});

async function openFile(file){

 if(busy)return;

 const ext=file.name.split('.').pop().toLowerCase();

 if(!['doc','docx'].includes(ext)){
  alert('只支援 DOC 和 DOCX 文件');
  input.value='';
  return;
 }

 if(file.size===0 || file.size>30*1024*1024){
  alert('文件大小不正確，或超過30MB');
  input.value='';
  return;
 }

 busy=true;

 $('loading').style.display='block';
 $('paper').style.display='none';
 $('toolbar').style.display='none';

 viewer.innerHTML='';
 fullText='';
 resetSearch();

 try{

  let buffer=await file.arrayBuffer();

  if(ext==='doc'){

   message('正在轉換舊版 DOC 成 DOCX...');

   buffer=await convertDOC(file);

   message('轉換成功，正在還原 Word 排版...');
  }else{

   message('正在讀取 DOCX 文件...');
  }

  if(!window.docx || !docx.renderAsync){
   throw new Error(
    'DOCX 排版引擎未能載入，請檢查網絡。'
   );
  }

  plainMode=false;

  await docx.renderAsync(
   buffer,
   viewer,
   viewer,
   {
    className:'docx',
    inWrapper:true,
    ignoreWidth:false,
    ignoreHeight:false,
    ignoreFonts:false,
    breakPages:true,
    ignoreLastRenderedPageBreak:false,
    experimental:false,
    trimXmlDeclaration:true,
    useBase64URL:true,
    renderChanges:false,
    renderHeaders:true,
    renderFooters:true,
    renderFootnotes:true,
    renderEndnotes:true
   }
  );

  fullText=getText();

  if(!fullText.trim()){
   throw new Error('文件沒有可讀取的文字內容。');
  }

  $('meta').textContent=
   file.name+' | '+
   (file.size/1024).toFixed(1)+' KB | '+
   ext.toUpperCase()+
   (ext==='doc'?' → DOCX':'') ;

  $('search').value='';

  zoom=100;
  viewer.style.zoom='1';

  $('zoom').textContent='100%';

  drop.style.display='none';
  $('paper').style.display='block';
  $('toolbar').style.display='flex';

  message(
   ext==='doc'?
   '舊版 DOC 轉換及載入成功！':
   'DOCX 文件載入成功！'
  );

 }catch(err){

  console.error(err);

  viewer.innerHTML='';
  fullText='';

  message('讀取失敗：'+err.message);

  alert('文件讀取失敗：\n\n'+err.message);

 }finally{

  $('loading').style.display='none';
  input.value='';
  busy=false;
 }
}

/* 搜尋 */

$('search').addEventListener('input',()=>{

 removeMarks();

 const q=$('search').value.trim();

 if(!q)return;

 const escaped=q.replace(
  /[.*+?^${}()|[\]\\]/g,'\\$&'
 );

 const re=new RegExp(escaped,'gi');

 const walker=document.createTreeWalker(
  viewer,
  NodeFilter.SHOW_TEXT,
  {
   acceptNode(node){

    if(!node.nodeValue.trim()){
     return NodeFilter.FILTER_REJECT;
    }

    if(node.parentElement.closest('mark')){
     return NodeFilter.FILTER_REJECT;
    }

    return NodeFilter.FILTER_ACCEPT;
   }
  }
 );

 const nodes=[];
 let node;

 while((node=walker.nextNode())){
  nodes.push(node);
 }

 nodes.forEach(n=>{

  const val=n.nodeValue;

  re.lastIndex=0;

  if(!re.test(val))return;

  re.lastIndex=0;

  const frag=document.createDocumentFragment();

  let last=0;
  let m;

  while((m=re.exec(val))!==null){

   frag.appendChild(
    document.createTextNode(val.slice(last,m.index))
   );

   const mark=document.createElement('mark');
   mark.textContent=m[0];

   frag.appendChild(mark);

   last=re.lastIndex;
  }

  frag.appendChild(
   document.createTextNode(val.slice(last))
  );

  n.replaceWith(frag);
 });

 matches=Array.from(viewer.querySelectorAll('mark'));

 current=matches.length?0:-1;

 updateSearch();
});

function updateSearch(){

 $('count').textContent=matches.length?
  (current+1)+'/'+matches.length:'0/0';

 matches.forEach((m,i)=>{
  m.classList.toggle('active',i===current);
 });

 if(current>=0){
  matches[current].scrollIntoView({
   behavior:'smooth',
   block:'center'
  });
 }
}

function moveSearch(dir){

 if(!matches.length)return;

 current=(current+dir+matches.length)%matches.length;

 updateSearch();
}

$('next').onclick=()=>moveSearch(1);
$('prev').onclick=()=>moveSearch(-1);

/* 複製全文 */

$('copy').onclick=async()=>{

 try{

  const text=getText();

  if(navigator.clipboard && window.isSecureContext){

   await navigator.clipboard.writeText(text);

  }else{

   const t=document.createElement('textarea');

   t.value=text;

   document.body.appendChild(t);
   t.select();

   if(!document.execCommand('copy')){
    throw new Error('Copy failed');
   }

   t.remove();
  }

  alert('全文已複製');

 }catch(e){

  alert('複製失敗，請手動選取文字');
 }
};

/* 關閉文件 */

$('clear').onclick=()=>{

 viewer.innerHTML='';

 $('paper').style.display='none';
 $('toolbar').style.display='none';

 drop.style.display='block';

 $('meta').textContent='';
 $('search').value='';

 fullText='';
 plainMode=false;
 zoom=100;

 resetSearch();

 message('等待載入文件');
};

/* 深色模式 */

$('themeBtn').onclick=()=>{

 document.body.classList.toggle('dark');

 $('themeBtn').textContent=
  document.body.classList.contains('dark')?
  '☀️':'🌙';
};

/* 拖放 */

drop.addEventListener('dragover',e=>{
 e.preventDefault();
 drop.classList.add('drag');
});

drop.addEventListener('dragleave',()=>{
 drop.classList.remove('drag');
});

drop.addEventListener('drop',e=>{

 e.preventDefault();

 drop.classList.remove('drag');

 const file=e.dataTransfer.files[0];

 if(file)openFile(file);
});

document.addEventListener('dragover',e=>{
 e.preventDefault();
});

document.addEventListener('drop',e=>{

 if(e.target!==drop && !drop.contains(e.target)){
  e.preventDefault();
 }
});

</script>
</body>
</html>
