
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word 文件閱讀器 6.0</title>

<!-- DOCX 排版引擎 -->
<script src="https://cdn.jsdelivr.net/npm/docx-preview@0.3.6/dist/docx-preview.min.js"></script>

<!-- 舊版 DOC 專用解析器 -->
<script src="https://cdn.jsdelivr.net/gh/Alpaq92/JSDoc@main/src/docToText.js"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#f1f5f9;
 color:#1e293b;
 font-family:Arial,"Microsoft JhengHei",sans-serif;
}

header{
 background:white;
 padding:16px 22px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 border-bottom:1px solid #ddd;
}

h1{font-size:19px;margin:0}

button,.upload{
 border:0;
 border-radius:8px;
 padding:11px 16px;
 background:#2563eb;
 color:white;
 cursor:pointer;
 font-size:14px;
 display:inline-block;
}

button:hover,.upload:hover{background:#1d4ed8}
button:disabled{opacity:.5;cursor:not-allowed}

.toolbar{
 background:white;
 padding:12px;
 display:flex;
 gap:9px;
 align-items:center;
 flex-wrap:wrap;
 justify-content:center;
}

.toolbar input{
 padding:10px;
 border:1px solid #ddd;
 border-radius:7px;
 min-width:160px;
}

#fileInput{display:none}

main{
 padding:20px;
 max-width:1400px;
 margin:auto;
}

#dropzone{
 background:white;
 border:2px dashed #94a3b8;
 border-radius:15px;
 padding:55px 20px;
 text-align:center;
 cursor:pointer;
}

#dropzone.drag{
 border-color:#2563eb;
 background:#eff6ff;
}

#loading{
 display:none;
 text-align:center;
 padding:20px;
}

#message{
 padding:12px;
 text-align:center;
 color:#475569;
}

#meta{
 text-align:center;
 color:#64748b;
 font-size:13px;
 margin:12px;
}

#paper{
 display:none;
 background:#cbd5e1;
 padding:30px 12px;
 min-height:80vh;
 overflow:auto;
}

/* 文件顯示 */

#viewer{
 width:100%;
 margin:auto;
}

/* DOCX 頁面 */

#viewer .docx-wrapper{
 background:transparent;
 padding:0;
}

#viewer .docx{
 margin:0 auto 25px;
 box-shadow:0 3px 15px #0002;
}

/* DOC 舊版 Word */

.doc-html{
 background:white;
 color:#222;
 padding:40px;
 min-height:70vh;
 max-width:1000px;
 margin:auto;
 overflow-x:auto;
 line-height:1.7;
 overflow-wrap:break-word;
 font-family:"Times New Roman","Microsoft JhengHei",Arial,sans-serif;
 font-size:16px;
}

/* 段落 */

.doc-html p{
 margin-top:0;
 margin-bottom:8px;
 line-height:1.7;
}

/* 標題 */

.doc-html h1{
 font-size:26px;
 margin:20px 0 15px;
}

.doc-html h2{
 font-size:22px;
 margin:18px 0 12px;
}

.doc-html h3{
 font-size:19px;
 margin:15px 0 10px;
}

/* 字體格式 */

.doc-html strong,
.doc-html b{
 font-weight:bold;
}

.doc-html em,
.doc-html i{
 font-style:italic;
}

.doc-html u{
 text-decoration:underline;
}

.doc-html s,
.doc-html strike{
 text-decoration:line-through;
}

.doc-html sup{
 vertical-align:super;
 font-size:smaller;
}

.doc-html sub{
 vertical-align:sub;
 font-size:smaller;
}

/* 表格：保留原有格式 */

.doc-html table{
 border-collapse:collapse;
 border-spacing:0;
 max-width:100%;
 margin:12px 0;
 table-layout:auto;
}

.doc-html td,
.doc-html th{
 padding:5px 8px;
 vertical-align:top;
 min-width:25px;
}

.doc-html td p,
.doc-html th p{
 margin:0 0 5px;
}

.doc-html tr{
 page-break-inside:avoid;
}

/* 圖片 */

.doc-html img{
 max-width:100%;
 height:auto;
 object-fit:contain;
}

.doc-html table img{
 max-width:100%;
}

/* 連結 */

.doc-html a{
 color:#2563eb;
 text-decoration:underline;
}

/* 清單 */

.doc-html ul,
.doc-html ol{
 padding-left:35px;
}

.doc-html li{
 margin-bottom:4px;
}

/* 引用及分隔線 */

.doc-html blockquote{
 margin:15px 25px;
 padding-left:15px;
 border-left:3px solid #94a3b8;
}

.doc-html hr{
 border:0;
 border-top:1px solid #999;
 margin:20px 0;
}

/* 搜尋結果 */

mark{
 background:#fde047 !important;
 color:#111 !important;
}

mark.active{
 outline:2px solid #f97316;
}

/* 深色模式 */

.dark{
 background:#0f172a;
 color:#f1f5f9;
}

.dark header,
.dark .toolbar,
.dark #dropzone{
 background:#1e293b;
 color:#f1f5f9;
}

.dark #dropzone{border-color:#475569}
.dark #paper{background:#334155}

.dark .doc-html{
 background:#1e293b;
 color:#f1f5f9;
}

.dark .doc-html td,
.dark .doc-html th{
 border-color:#64748b;
}

.dark .doc-html a{
 color:#93c5fd;
}

.dark .toolbar input{
 background:#334155;
 color:white;
 border-color:#475569;
}

.dark #message,
.dark #meta{
 color:#cbd5e1;
}

.dark mark{
 background:#facc15 !important;
 color:#111 !important;
}

@media(max-width:700px){

 header{padding:12px}
 h1{font-size:16px}

 main{padding:10px}

 #paper{padding:10px 3px}

 .toolbar{gap:6px}

 .toolbar input{
  min-width:120px;
  flex:1;
 }

 .toolbar button{
  padding:9px 11px;
 }

 .doc-html{
  padding:15px;
  font-size:14px;
 }

 .doc-html table{
  font-size:13px;
 }

}
</style>
</head>

<body>

<header>
 <div>
  <h1>📄 Word 文件閱讀器 6.0</h1>
  <small>DOC / DOCX · 完整格式閱讀</small>
 </div>
 <button id="themeBtn">🌙</button>
</header>

<div class="toolbar" id="toolbar" style="display:none">
 <input type="search" id="search" placeholder="搜尋文件文字">
 <button id="prev">↑</button>
 <button id="next">↓</button>
 <span id="count">0/0</span>
 <button id="smaller">－</button>
 <span id="zoom">100%</span>
 <button id="bigger">＋</button>
 <button id="copy">📋 複製全文</button>
 <button id="clear">關閉文件</button>
</div>

<main>

<input type="file" id="fileInput" accept=".doc,.docx">

<div id="dropzone">

 <div style="font-size:50px">📂</div>

 <h2>開啟 Word 文件</h2>

 <p>選擇 DOC 或 DOCX 文件，或直接拖放到這裡。</p>

 <label for="fileInput" class="upload">
 選擇電腦檔案
 </label>

 <p style="font-size:12px;color:#94a3b8;margin-top:20px">
 DOCX：Word 頁面及格式還原<br>
 DOC：舊版 Word 格式、表格及文字解析<br>
 文件只在瀏覽器本機處理，不會上傳
 </p>

</div>

<div id="loading">⏳ 正在讀取文件...</div>
<div id="message">等待載入文件</div>
<div id="meta"></div>

<article id="paper">
 <div id="viewer"></div>
</article>

</main>

<script>
'use strict';

const $=id=>document.getElementById(id);

const input=$('fileInput');
const drop=$('dropzone');
const viewer=$('viewer');

let zoom=100;
let matches=[];
let current=-1;
let busy=false;

/* 訊息 */

function message(text){
 $('message').textContent=text;
}

/* 搜尋重設 */

function resetSearch(){
 matches=[];
 current=-1;
 $('count').textContent='0/0';
}

/* 移除搜尋標記 */

function removeMarks(){

 viewer.querySelectorAll('mark').forEach(m=>{
  m.replaceWith(document.createTextNode(m.textContent));
 });

 viewer.normalize();
 resetSearch();
}

/* 全文 */

function getText(){
 return viewer.innerText || viewer.textContent || '';
}

/* 放大縮小 */

function updateZoom(){

 viewer.style.zoom=zoom/100;
 $('zoom').textContent=zoom+'%';
}

$('bigger').onclick=()=>{
 zoom=Math.min(180,zoom+10);
 updateZoom();
};

$('smaller').onclick=()=>{
 zoom=Math.max(60,zoom-10);
 updateZoom();
};

/* 取得 DOC HTML */

function getDocHtml(result){

 if(typeof result==='string'){
  return result;
 }

 if(!result || typeof result!=='object'){
  return '';
 }

 const keys=[
  'body',
  'html',
  'document',
  'content'
 ];

 for(const key of keys){

  if(typeof result[key]==='string'){
   return result[key];
  }

 }

 return '';
}

/* 檢查 DOC 解析器 */

function checkDocEngine(){

 if(typeof window.docToText!=='function'){
  throw new Error(
   'DOC 舊版解析器未能載入，請檢查網絡或 CDN。'
  );
 }

 if(typeof window.docToText.html!=='function'){
  throw new Error(
   'DOC 解析器不支援 HTML 格式輸出。'
  );
 }

}

/* 載入文件 */

input.addEventListener('change',()=>{

 const file=input.files[0];

 if(file)openFile(file);

});

async function openFile(file){

 if(busy)return;

 const ext=file.name.split('.').pop().toLowerCase();

 if(!['doc','docx'].includes(ext)){
  alert('只支援 DOC 和 DOCX 文件');
  input.value='';
  return;
 }

 if(file.size===0 || file.size>30*1024*1024){
  alert('文件大小不正確，或超過30MB');
  input.value='';
  return;
 }

 busy=true;

 $('loading').style.display='block';
 $('paper').style.display='none';
 $('toolbar').style.display='none';

 viewer.innerHTML='';
 viewer.style.zoom='1';

 resetSearch();

 message('正在讀取 '+file.name+'...');

 try{

  const buffer=await file.arrayBuffer();

  /* =========================
     DOCX 新版 Word
  ========================= */

  if(ext==='docx'){

   message('正在還原 DOCX Word 排版...');

   if(!window.docx || !docx.renderAsync){
    throw new Error(
     'DOCX 排版引擎未能載入，請檢查網絡。'
    );
   }

   await docx.renderAsync(
    buffer,
    viewer,
    viewer,
    {
     className:'docx',
     inWrapper:true,

     ignoreWidth:false,
     ignoreHeight:false,
     ignoreFonts:false,

     breakPages:true,
     ignoreLastRenderedPageBreak:false,

     experimental:true,
     trimXmlDeclaration:true,
     useBase64URL:true,

     renderChanges:false,
     renderHeaders:true,
     renderFooters:true,
     renderFootnotes:true,
     renderEndnotes:true
    }
   );

  }

  /* =========================
     DOC 舊版 Word
  ========================= */

  else{

   message('正在解析舊版 DOC 格式及表格...');

   checkDocEngine();

   let result=docToText.html(
    new Uint8Array(buffer)
   );

   if(result && typeof result.then==='function'){
    result=await result;
   }

   let html=getDocHtml(result);

   if(!html){

    /* 解析器純文字備用 */

    const text=docToText(
     new Uint8Array(buffer)
    );

    if(typeof text==='string' && text.trim()){

     const container=document.createElement('div');
     container.className='doc-html';

     const p=document.createElement('p');
     p.textContent=text;

     container.appendChild(p);
     viewer.appendChild(container);

     message(
      'DOC 已開啟 · 使用純文字備用模式，原有格式未能完整還原'
     );

    }else{

     throw new Error(
      '無法解析此 DOC 文件。可能是加密、損壞、Word 6/95 或不支援的格式。'
     );

    }

   }else{

    const container=document.createElement('div');
    container.className='doc-html';

    container.innerHTML=html;

    viewer.innerHTML='';
    viewer.appendChild(container);

    /* 表格自適應 */

    container.querySelectorAll('table').forEach(table=>{

     table.style.maxWidth='100%';

    });

    /* 圖片自適應 */

    container.querySelectorAll('img').forEach(img=>{

     img.style.maxWidth='100%';
     img.style.height='auto';

    });

    /* 確認內容 */

    if(!container.textContent.trim() &&
       !container.querySelector('table,img')){

     throw new Error('DOC 文件沒有可讀取的內容。');

    }

    const tables=container.querySelectorAll('table').length;

    message(
     'DOC 載入成功 · '+tables+' 個表格 · 格式化模式'
    );

   }

  }

  if(
   !getText().trim() &&
   !viewer.querySelector('table,img')
  ){

   throw new Error('文件沒有可讀取的內容。');

  }

  /* 文件資訊 */

  $('meta').textContent=
   file.name+' | '+
   (file.size/1024).toFixed(1)+' KB | '+
   ext.toUpperCase();

  $('search').value='';

  zoom=100;
  viewer.style.zoom='1';

  $('zoom').textContent='100%';

  drop.style.display='none';
  $('paper').style.display='block';
  $('toolbar').style.display='flex';

  if(ext==='docx'){
   message('DOCX 文件載入成功');
  }

 }catch(err){

  console.error(err);

  viewer.innerHTML='';

  message('讀取失敗：'+err.message);

  alert(
   '文件讀取失敗：\n\n'+err.message
  );

 }finally{

  $('loading').style.display='none';

  input.value='';
  busy=false;

 }

}

/* =========================
   搜尋文件
========================= */

$('search').addEventListener('input',()=>{

 removeMarks();

 const q=$('search').value.trim();

 if(!q)return;

 const escaped=q.replace(
  /[.*+?^${}()|[\]\\]/g,
  '\\$&'
 );

 const re=new RegExp(escaped,'gi');

 const walker=document.createTreeWalker(
  viewer,
  NodeFilter.SHOW_TEXT,
  {
   acceptNode(node){

    if(!node.nodeValue.trim()){
     return NodeFilter.FILTER_REJECT;
    }

    if(node.parentElement.closest(
     'mark,script,style'
    )){
     return NodeFilter.FILTER_REJECT;
    }

    return NodeFilter.FILTER_ACCEPT;

   }
  }
 );

 const nodes=[];
 let node;

 while((node=walker.nextNode())){
  nodes.push(node);
 }

 nodes.forEach(n=>{

  const val=n.nodeValue;

  re.lastIndex=0;

  if(!re.test(val))return;

  re.lastIndex=0;

  const frag=document.createDocumentFragment();

  let last=0;
  let m;

  while((m=re.exec(val))!==null){

   frag.appendChild(
    document.createTextNode(
     val.slice(last,m.index)
    )
   );

   const mark=document.createElement('mark');
   mark.textContent=m[0];

   frag.appendChild(mark);

   last=re.lastIndex;

  }

  frag.appendChild(
   document.createTextNode(val.slice(last))
  );

  n.replaceWith(frag);

 });

 matches=Array.from(
  viewer.querySelectorAll('mark')
 );

 current=matches.length?0:-1;

 updateSearch();

});

function updateSearch(){

 $('count').textContent=matches.length?
  (current+1)+'/'+matches.length:'0/0';

 matches.forEach((m,i)=>{
  m.classList.toggle('active',i===current);
 });

 if(current>=0){

  matches[current].scrollIntoView({
   behavior:'smooth',
   block:'center'
  });

 }

}

function moveSearch(dir){

 if(!matches.length)return;

 current=(
  current+dir+matches.length
 )%matches.length;

 updateSearch();

}

$('next').onclick=()=>moveSearch(1);
$('prev').onclick=()=>moveSearch(-1);

/* =========================
   複製全文
========================= */

$('copy').onclick=async()=>{

 try{

  const text=getText();

  if(navigator.clipboard && window.isSecureContext){

   await navigator.clipboard.writeText(text);

  }else{

   const t=document.createElement('textarea');

   t.value=text;

   document.body.appendChild(t);
   t.select();

   if(!document.execCommand('copy')){
    throw new Error('Copy failed');
   }

   t.remove();

  }

  alert('全文已複製');

 }catch(e){

  alert('複製失敗，請手動選取文字');

 }

};

/* =========================
   關閉文件
========================= */

$('clear').onclick=()=>{

 viewer.innerHTML='';
 viewer.style.zoom='1';

 $('paper').style.display='none';
 $('toolbar').style.display='none';

 drop.style.display='block';

 $('meta').textContent='';
 $('search').value='';

 zoom=100;

 resetSearch();

 message('等待載入文件');

};

/* =========================
   深色模式
========================= */

$('themeBtn').onclick=()=>{

 document.body.classList.toggle('dark');

 $('themeBtn').textContent=
  document.body.classList.contains('dark')?
  '☀️':'🌙';

};

/* =========================
   拖放文件
========================= */

drop.addEventListener('dragover',e=>{

 e.preventDefault();
 drop.classList.add('drag');

});

drop.addEventListener('dragleave',()=>{

 drop.classList.remove('drag');

});

drop.addEventListener('drop',e=>{

 e.preventDefault();

 drop.classList.remove('drag');

 const file=e.dataTransfer.files[0];

 if(file)openFile(file);

});

document.addEventListener('dragover',e=>{
 e.preventDefault();
});

document.addEventListener('drop',e=>{

 if(e.target!==drop && !drop.contains(e.target)){
  e.preventDefault();
 }

});

</script>

</body>
</html>
