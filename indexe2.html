<!DOCTYPE html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全功能線上 EPUB 閱讀器 (中日英支援/高畫質圖片)</title>

    


    
    <!-- Tailwind CSS CDN -->

    <!-- Font Awesome Icons -->

    <!-- JSZip (EPUB 檔案解壓縮必備) -->

    <!-- epub.js 核心庫 -->
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        sepia: {
                            50: '#fbf0d9',
                            100: '#f4ecd8',
                            800: '#5f4b32',
                            900: '#3d2e1e'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* EPUB 渲染容器基礎樣式 */
        #viewer {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        #viewer iframe {
            border: none;
            background: transparent !important;
        }

        /* 隱藏滾動條但保持滾動能力 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 圖片放大預覽燈箱樣式 */
        #image-modal {
            transition: opacity 0.2s ease;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 h-screen flex flex-col font-sans overflow-hidden transition-colors duration-200">

    <!-- 頂部控制導覽列 -->
    <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-4 py-2.5 flex items-center justify-between shadow-sm z-20">

                <p id="book-author" class="text-xs text-gray-500 dark:text-gray-400 truncate">請載入檔案或使用範例書</p>

            <div class="hidden lg:flex items-center text-xs bg-indigo-50 dark:bg-indigo-900/40 text-indigo-700 dark:text-indigo-300 px-2.5 py-1 rounded-lg border border-indigo-100 dark:border-indigo-800">

    <!-- 主要內容區 -->
    <div class="relative flex-1 flex overflow-hidden">

            <span id="page-info" class="whitespace-nowrap hidden sm:inline font-mono">頁碼準備中...</span>

    <script>
        /**
         * 支援中日英多國語系與高畫質圖片的 EPUB 閱讀器核心
         */
        class EpubReaderApp {
            constructor() {
                this.book = null;
                this.rendition = null;
                this.toc = [];
                
                this.isVertical = false; // 是否為直排模式
                this.isSinglePage = true; // 預設改為單頁顯示
                this.currentTheme = 'light';
                this.fontSizePercent = 100;
                this.fontFamily = 'system';
                
                this.dom = {
                    fileInput: document.getElementById('file-input'),
                    exitBtn: document.getElementById('exit-btn'),
                    loadSampleBtn: document.getElementById('load-sample-btn'),
                    uploadOverlay: document.getElementById('upload-overlay'),
                    viewer: document.getElementById('viewer'),
                    prevBtn: document.getElementById('prev-btn'),
                    nextBtn: document.getElementById('next-btn'),
                    tocBtn: document.getElementById('toc-btn'),
                    closeTocBtn: document.getElementById('close-toc'),
                    tocSidebar: document.getElementById('toc-sidebar'),
                    sidebarOverlay: document.getElementById('sidebar-overlay'),
                    tocList: document.getElementById('toc-list'),
                    bookTitle: document.getElementById('book-title'),
                    bookAuthor: document.getElementById('book-author'),
                    layoutToggle: document.getElementById('layout-toggle'),
                    layoutText: document.getElementById('layout-text'),
                    spreadToggle: document.getElementById('spread-toggle'),
                    spreadText: document.getElementById('spread-text'),
                    fontFamilySelect: document.getElementById('font-family-select'),
                    fontIncrease: document.getElementById('font-increase'),
                    fontDecrease: document.getElementById('font-decrease'),
                    fontSizeDisplay: document.getElementById('font-size-display'),
                    themeBtns: document.querySelectorAll('.theme-btn'),
                    progressSlider: document.getElementById('progress-slider'),
                    currLocation: document.getElementById('curr-location'),
                    pageInfo: document.getElementById('page-info'),
                    imageModal: document.getElementById('image-modal'),
                    modalImg: document.getElementById('modal-img'),
                    closeModal: document.getElementById('close-modal'),
                    toast: document.getElementById('toast'),
                    toastMsg: document.getElementById('toast-msg')
                };

                this.initEvents();
            }

            initEvents() {
                this.dom.fileInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) this.loadBook(file);
                });

                this.dom.loadSampleBtn.addEventListener('click', () => {
                    this.loadMultiLanguageSampleEpub();
                });

                if (this.dom.exitBtn) {
                    this.dom.exitBtn.addEventListener('click', () => this.closeBook());
                }

                // 拖曳上傳
                window.addEventListener('dragover', (e) => e.preventDefault());
                window.addEventListener('drop', (e) => {
                    e.preventDefault();
                    if (e.dataTransfer.files.length > 0 && e.dataTransfer.files[0].name.endsWith('.epub')) {
                        this.loadBook(e.dataTransfer.files[0]);
                    }
                });

                this.dom.prevBtn.addEventListener('click', () => this.prevPage());
                this.dom.nextBtn.addEventListener('click', () => this.nextPage());

                this.dom.tocBtn.addEventListener('click', () => this.toggleToc(true));
                this.dom.closeTocBtn.addEventListener('click', () => this.toggleToc(false));
                this.dom.sidebarOverlay.addEventListener('click', () => this.toggleToc(false));

                this.dom.layoutToggle.addEventListener('click', () => this.toggleLayoutMode());
                if (this.dom.spreadToggle) {
                    this.dom.spreadToggle.addEventListener('click', () => this.toggleSpreadMode());
                }

                this.dom.fontFamilySelect.addEventListener('change', (e) => {
                    this.fontFamily = e.target.value;
                    this.applyCurrentStyle();
                });

                this.dom.fontIncrease.addEventListener('click', () => this.changeFontSize(10));
                this.dom.fontDecrease.addEventListener('click', () => this.changeFontSize(-10));

                this.dom.themeBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.setTheme(e.currentTarget.getAttribute('data-theme'));
                    });
                });

                this.dom.progressSlider.addEventListener('change', (e) => {
                    if (this.book && this.book.locations && this.book.locations.length()) {
                        const percentage = e.target.value / 100;
                        const cfi = this.book.locations.cfiFromPercentage(percentage);
                        if (cfi) this.rendition.display(cfi);
                    }
                });

                // 圖片燈箱關閉
                this.dom.closeModal.addEventListener('click', () => this.closeImageModal());
                this.dom.imageModal.addEventListener('click', (e) => {
                    if (e.target === this.dom.imageModal) this.closeImageModal();
                });

                // 鍵盤翻頁
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowLeft') {
                        this.isVertical ? this.nextPage() : this.prevPage();
                    } else if (e.key === 'ArrowRight') {
                        this.isVertical ? this.prevPage() : this.nextPage();
                    } else if (e.key === 'Escape') {
                        this.closeImageModal();
                    }
                });
            }

            /**
             * 載入並初始化 EPUB 檔案
             */
            async loadBook(fileOrArrayBuffer) {
                try {
                    // 隱藏歡迎/上傳遮罩，顯示離開預覽按鈕
                    this.dom.uploadOverlay.classList.add('hidden');
                    if (this.dom.exitBtn) this.dom.exitBtn.classList.remove('hidden');

                    // 若已有舊書籍，先釋放資源
                    if (this.rendition) {
                        try { this.rendition.destroy(); } catch(e){}
                        this.rendition = null;
                    }
                    if (this.book) {
                        try { this.book.destroy(); } catch(e){}
                        this.book = null;
                    }
                    this.dom.viewer.innerHTML = '';

                    let arrayBuffer;
                    if (fileOrArrayBuffer instanceof File || fileOrArrayBuffer instanceof Blob) {
                        arrayBuffer = await fileOrArrayBuffer.arrayBuffer();
                    } else {
                        arrayBuffer = fileOrArrayBuffer;
                    }

                    this.renderEpub(arrayBuffer);
                } catch (error) {
                    console.error("載入 EPUB 失敗:", error);
                    this.showToast("無法載入此 EPUB 檔案，請確認檔案格式是否正確。");
                    this.closeBook();
                }
            }

            /**
             * 離開預覽並清理系統狀態
             */
            closeBook() {
                if (this.rendition) {
                    try { this.rendition.destroy(); } catch(e){}
                    this.rendition = null;
                }
                if (this.book) {
                    try { this.book.destroy(); } catch(e){}
                    this.book = null;
                }
                this.dom.viewer.innerHTML = '';
                this.dom.bookTitle.textContent = 'EPUB 閱讀器 (中日英/高畫質圖片)';
                this.dom.bookAuthor.textContent = '請載入檔案或使用範例書';
                this.dom.tocList.innerHTML = '<p class="text-gray-400 text-center py-8">未載入目錄</p>';
                this.dom.progressSlider.value = 0;
                this.dom.currLocation.textContent = '0%';
                this.dom.pageInfo.textContent = '頁碼準備中...';
                if (this.dom.fileInput) this.dom.fileInput.value = '';
                if (this.dom.exitBtn) this.dom.exitBtn.classList.add('hidden');
                this.dom.uploadOverlay.classList.remove('hidden');
                this.toggleToc(false);
            }

            /**
             * 顯示非阻塞 Toast 訊息
             */
            showToast(message) {
                if (!this.dom.toast) return;
                this.dom.toastMsg.textContent = message;
                this.dom.toast.classList.remove('hidden', 'translate-y-10', 'opacity-0');
                setTimeout(() => {
                    this.dom.toast.classList.add('translate-y-10', 'opacity-0');
                    setTimeout(() => this.dom.toast.classList.add('hidden'), 300);
                }, 3500);
            }

            renderEpub(arrayBuffer) {
                this.book = ePub(arrayBuffer);

                // 設定 spread: 'none' 可強制固定為單頁顯示，不論螢幕寬度
                this.rendition = this.book.renderTo('viewer', {
                    width: '100%',
                    height: '100%',
                    spread: this.isSinglePage ? 'none' : 'auto',
                    flow: 'paginated'
                });

                this.rendition.display();

                this.book.loaded.metadata.then(meta => {
                    this.dom.bookTitle.textContent = meta.title || '無標題電子書';
                    this.dom.bookAuthor.textContent = meta.creator || '未知作者';
                });

                this.book.loaded.navigation.then(nav => {
                    this.toc = nav.toc;
                    this.renderToc();
                });

                this.book.ready.then(() => {
                    return this.book.locations.generate(1000);
                }).then(() => {
                    this.updateProgress();
                });

                this.rendition.on('relocated', (location) => {
                    this.updateProgress(location);
                    this.injectImageHandlers(); // 確保每次換頁後圖片皆可點擊放大
                });

                this.registerThemes();
                this.applyCurrentStyle();
            }

            toggleSpreadMode() {
                this.isSinglePage = !this.isSinglePage;
                
                if (this.dom.spreadText) {
                    this.dom.spreadText.textContent = this.isSinglePage ? '單頁顯示' : '雙頁顯示';
                }

                if (this.rendition) {
                    // 切換 ePub.js 渲染頁面佈局 (none = 單頁, auto = 根據寬度跨頁/雙頁)
                    this.rendition.spread(this.isSinglePage ? 'none' : 'auto');
                }
            }

            toggleLayoutMode() {
                this.isVertical = !this.isVertical;
                
                if (this.isVertical) {
                    this.dom.layoutText.textContent = '直排閱讀';
                    this.dom.layoutToggle.classList.add('border-indigo-500', 'text-indigo-600', 'bg-indigo-50');
                } else {
                    this.dom.layoutText.textContent = '橫排閱讀';
                    this.dom.layoutToggle.classList.remove('border-indigo-500', 'text-indigo-600', 'bg-indigo-50');
                }

                this.applyCurrentStyle();
            }

            registerThemes() {
                if (!this.rendition) return;
                this.rendition.themes.register('light', { 'body': { 'background': '#ffffff !important', 'color': '#1f2937 !important' } });
                this.rendition.themes.register('sepia', { 'body': { 'background': '#f4ecd8 !important', 'color': '#3d2e1e !important' } });
                this.rendition.themes.register('dark', { 'body': { 'background': '#1f2937 !important', 'color': '#f3f4f6 !important' } });
            }

            applyCurrentStyle() {
                if (!this.rendition) return;

                this.rendition.themes.select(this.currentTheme);
                this.rendition.themes.fontSize(`${this.fontSizePercent}%`);

                // 字型設定
                let fontFamilyCss = 'system-ui, -apple-system, sans-serif';
                if (this.fontFamily === 'serif') {
                    fontFamilyCss = '"Noto Serif CJK TC", "Source Han Serif JP", "Times New Roman", serif';
                } else if (this.fontFamily === 'sans') {
                    fontFamilyCss = '"Noto Sans CJK TC", "Source Han Sans JP", "Microsoft JhengHei", sans-serif';
                }

                // 中/日/英排版與高畫質圖片優化 CSS
                const layoutCss = this.isVertical ? `
                    html, body, p, div, span, h1, h2, h3, h4, h5, h6 {
                        writing-mode: vertical-rl !important;
                        -webkit-writing-mode: vertical-rl !important;
                        text-orientation: mixed !important;
                        letter-spacing: 0.08em !important;
                        line-height: 2.0 !important;
                        font-family: ${fontFamilyCss} !important;
                    }
                    img {
                        max-height: 80vh !important;
                        max-width: 90% !important;
                        width: auto !important;
                        height: auto !important;
                        object-fit: contain !important;
                        margin: 1.5rem auto !important;
                        display: block !important;
                        cursor: zoom-in !important;
                        border-radius: 4px;
                    }
                ` : `
                    html, body, p, div, span, h1, h2, h3, h4, h5, h6 {
                        writing-mode: horizontal-tb !important;
                        -webkit-writing-mode: horizontal-tb !important;
                        line-height: 1.7 !important;
                        font-family: ${fontFamilyCss} !important;
                    }
                    img {
                        max-width: 100% !important;
                        height: auto !important;
                        max-height: 75vh !important;
                        object-fit: contain !important;
                        margin: 1.5rem auto !important;
                        display: block !important;
                        cursor: zoom-in !important;
                        border-radius: 6px;
                    }
                `;

                const iframe = this.dom.viewer.querySelector('iframe');
                if (iframe && iframe.contentDocument) {
                    let styleTag = iframe.contentDocument.getElementById('custom-layout-style');
                    if (!styleTag) {
                        styleTag = iframe.contentDocument.createElement('style');
                        styleTag.id = 'custom-layout-style';
                        iframe.contentDocument.head.appendChild(styleTag);
                    }
                    styleTag.innerHTML = layoutCss;
                    this.injectImageHandlers();
                }
            }

            /**
             * 注入圖片點擊放大監聽器，讓 EPUB 內的高畫質圖片可以點擊檢視
             */
            injectImageHandlers() {
                const iframe = this.dom.viewer.querySelector('iframe');
                if (!iframe || !iframe.contentDocument) return;

                const images = iframe.contentDocument.querySelectorAll('img');
                images.forEach(img => {
                    img.style.cursor = 'zoom-in';
                    img.onclick = () => {
                        this.dom.modalImg.src = img.src;
                        this.dom.imageModal.classList.remove('hidden', 'pointer-events-none');
                        this.dom.imageModal.classList.add('opacity-100');
                    };
                });
            }

            closeImageModal() {
                this.dom.imageModal.classList.remove('opacity-100');
                this.dom.imageModal.classList.add('hidden', 'pointer-events-none');
                this.dom.modalImg.src = '';
            }

            setTheme(theme) {
                this.currentTheme = theme;
                const container = document.getElementById('viewer-container');
                container.classList.remove('bg-white', 'bg-sepia-100', 'bg-gray-800');
                
                if (theme === 'light') {
                    container.classList.add('bg-white');
                    document.documentElement.classList.remove('dark');
                } else if (theme === 'sepia') {
                    container.classList.add('bg-sepia-100');
                    document.documentElement.classList.remove('dark');
                } else if (theme === 'dark') {
                    container.classList.add('bg-gray-800');
                    document.documentElement.classList.add('dark');
                }

                this.applyCurrentStyle();
            }

            changeFontSize(delta) {
                this.fontSizePercent = Math.min(Math.max(70, this.fontSizePercent + delta), 200);
                this.dom.fontSizeDisplay.textContent = `${this.fontSizePercent}%`;
                this.applyCurrentStyle();
            }

            prevPage() { if (this.rendition) this.rendition.prev(); }
            nextPage() { if (this.rendition) this.rendition.next(); }

            renderToc() {
                this.dom.tocList.innerHTML = '';
                if (!this.toc || this.toc.length === 0) {
                    this.dom.tocList.innerHTML = '<p class="text-gray-400 text-center py-4">無可用目錄</p>';
                    return;
                }

                const createTocNodes = (items) => {
                    const ul = document.createElement('ul');
                    ul.className = 'space-y-1 pl-2';

                    items.forEach(item => {
                        const li = document.createElement('li');
                        const a = document.createElement('a');
                        a.textContent = item.label.trim();
                        a.href = item.href;
                        a.className = 'block px-3 py-2 rounded-lg text-gray-700 dark:text-gray-300 hover:bg-indigo-50 dark:hover:bg-gray-700 hover:text-indigo-600 dark:hover:text-indigo-400 transition truncate cursor-pointer';
                        
                        a.addEventListener('click', (e) => {
                            e.preventDefault();
                            this.rendition.display(item.href);
                            this.toggleToc(false);
                        });

                        li.appendChild(a);
                        if (item.subitems && item.subitems.length > 0) {
                            li.appendChild(createTocNodes(item.subitems));
                        }
                        ul.appendChild(li);
                    });
                    return ul;
                };

                this.dom.tocList.appendChild(createTocNodes(this.toc));
            }

            toggleToc(show) {
                if (show) {
                    this.dom.tocSidebar.classList.remove('-translate-x-full');
                    this.dom.sidebarOverlay.classList.remove('hidden');
                } else {
                    this.dom.tocSidebar.classList.add('-translate-x-full');
                    this.dom.sidebarOverlay.classList.add('hidden');
                }
            }

            updateProgress(location) {
                if (!this.book || !this.book.locations) return;

                if (location && location.start) {
                    const percentage = Math.floor(this.book.locations.percentageFromCfi(location.start.cfi) * 100) || 0;
                    this.dom.progressSlider.value = percentage;
                    this.dom.currLocation.textContent = `${percentage}%`;
                    
                    if (location.start.displayed) {
                        this.dom.pageInfo.textContent = `第 ${location.start.displayed.page} / ${location.start.displayed.total} 頁`;
                    }
                }
            }
